version: '3.8'

services:
  pin-ai-assistant:
    build: .
    container_name: pin-ai-assistant
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  # Build the OpenClaw image for user containers
  openclaw-image:
    build:
      context: ./openclaw-image
    image: pinai-openclaw:latest
