# Local dev stack. Multiple worktrees can run side by side as independent
# Compose projects: the Makefile sets a per-worktree COMPOSE_PROJECT_NAME
# (hash of the worktree path), so container names, network and volumes are
# auto-namespaced and groups never collide. Host ports are published WITHOUT
# a fixed host number (e.g. "8000" not "8000:8000"), so Docker assigns a free
# host port per project. Find the live ports with `make urls`.
#
# Services intentionally have NO container_name (a fixed name is globally
# unique and breaks multi-group). Use `docker compose exec <service>` /
# `docker compose logs <service>` — never `docker ... pin-ai-<name>`.
services:
  # ── Database ──
  postgres:
    # pgvector/pgvector ships pgvector preinstalled. Supabase prod has the
    # extension built-in, so dev mirrors prod here. Keeping pg15 to match
    # the previous image's major version (no schema migration needed).
    image: ${PINAI_PGVECTOR_IMAGE:-pgvector/pgvector:pg15}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis (Agent Core live-frame bus) ──
  # Redis Streams back the resumable conversation SSE stream (frames:<session>):
  # publish=XADD, subscribe=XREAD BLOCK from a cursor. Frames are short-lived
  # (history truth is pai_chat_messages), so NO volume — a restart loses only
  # in-flight stream tails, which a client reconnect rebuilds from history.
  redis:
    image: ${PINAI_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Database migration (runs once, then exits) ──
  # ── LiteLLM proxy ──
  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.86.2
    restart: unless-stopped
    # LiteLLM is by far the heaviest container. One worker is plenty for local
    # dev (single user), and the cap keeps it from ballooning — important when
    # several worktree groups share Docker Desktop's memory.
    mem_limit: 1536m
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - ./ops/litellm/.env
    environment:
      # Share the backend Postgres DB via Prisma's ?schema=litellm — matches
      # dev/prod (ops/litellm/.env* all use postgres?schema=litellm). A separate
      # `litellm` database would put LiteLLM's tables on the wrong DB, so the
      # backend's cross-schema write to litellm."LiteLLM_VerificationToken"
      # (budget-reset sync during key provisioning) would hit UndefinedTable and
      # roll back the just-minted virtual key. (takes precedence over env_file)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres?schema=litellm
    ports:
      - "4000"
    volumes:
      - ./ops/litellm/litellm_config.yaml:/app/config.yaml:ro
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 120s

  # ── apis + openclaw retired ──
  # The legacy Node apis service (auth / container-orchestration / payment /
  # gateway / mobile-proxy) and the per-user OpenClaw runtime image have
  # both been folded into backend. See
  # docs/plans/2026-05-04-pinai-agents-backend-consolidation.mdx § retirement.
  # Source code stays in the repo for git history; nothing builds or runs.

  # ── DB bootstrap ──
  # One-shot: ensures the `litellm` schema exists (LiteLLM's Prisma migrations
  # build into postgres?schema=litellm — see the litellm service above), applies
  # pai_* yoyo migrations, then grants `service_role` USAGE on the litellm schema.
  # That last grant matters because provisioning writes
  # litellm."LiteLLM_VerificationToken" under `SET ROLE service_role`; unlike
  # Supabase (which auto-grants newly created schemas to service_role) a plain
  # local Postgres leaves the schema unprivileged, so the cross-schema budget-reset
  # write would 'permission denied' and abort the key-provisioning tx. The grant
  # runs after yoyo (which creates service_role) and ALTER DEFAULT PRIVILEGES
  # covers the tables LiteLLM creates afterward. Uses the backend image which
  # already ships postgresql-client + yoyo.
  db-migrate:
    build: &pinai-build
      context: ./backend
      dockerfile: Dockerfile
      args:
        DEPLOY_ENV: dev
        PYTHON_BASE_IMAGE: ${PINAI_PYTHON_BASE_IMAGE:-python:3.12-slim}
        UV_BASE_IMAGE: ${PINAI_UV_BASE_IMAGE:-ghcr.io/astral-sh/uv:0.11.21}
        PINAI_DEV_REGION: ${PINAI_DEV_REGION:-us}
        UV_DEFAULT_INDEX: ${PINAI_UV_DEFAULT_INDEX:-https://pypi.org/simple}
    image: backend:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
      # `+psycopg` selects psycopg v3 driver — the only Postgres adapter we
      # ship in the image. Default `postgresql://` looks for psycopg2 which
      # we deliberately don't install (psycopg v3 is the going-forward
      # adapter).
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/postgres
    working_dir: /app
    entrypoint: ["sh", "-eu", "-c"]
    command:
      - |
        echo "→ ensuring litellm schema exists..."
        if ! python3 -c "
        import psycopg
        conn = psycopg.connect('postgresql://postgres:postgres@postgres:5432/postgres', autocommit=True)
        conn.execute('CREATE SCHEMA IF NOT EXISTS litellm')
        print('  litellm schema ready')
        "; then
          echo "FATAL: failed to ensure litellm schema"; exit 1
        fi
        echo "→ applying pai_* yoyo migrations..."
        yoyo apply --batch -d "$$DATABASE_URL"
        echo "→ granting service_role access to litellm schema..."
        if ! python3 -c "
        import psycopg
        conn = psycopg.connect('postgresql://postgres:postgres@postgres:5432/postgres', autocommit=True)
        conn.execute('GRANT USAGE ON SCHEMA litellm TO service_role')
        conn.execute('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA litellm TO service_role')
        conn.execute('ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA litellm GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO service_role')
        print('  service_role granted on litellm schema')
        "; then
          echo "FATAL: failed to grant service_role on litellm schema"; exit 1
        fi
        echo "→ db-migrate complete."

  # ── backend WEB process group ──
  # Trust-bearing: holds Supabase service_role + HMAC signing key + Composio
  # master (all to be added in Step A-C). Currently only /health is mounted.
  # Single image, single source — see agent-engine below for the LLM-loop
  # process group sharing this image. Reference:
  # docs/plans/2026-05-04-pinai-agents-backend-consolidation.mdx § 部署形态.
  api:
    build: *pinai-build
    image: backend:latest
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      ENTRYPOINT_MODULE: pinai_api.asgi:app
      ENTRYPOINT_PORT: "8000"
      LITELLM_BASE_URL: http://litellm:4000/v1
      # Master credentials live in backend/.env (encrypted source:
      # .env.dev). The DB URL is overridden here only because the in-
      # cluster compose Postgres uses service-name DNS, not the prod
      # Supabase URL stored in .env.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Agent Core FrameBus (Redis Streams) — per-worktree compose redis.
      REDIS_URL: redis://redis:6379/0
      # web → chat HTTP proxy target.
      CHAT_INTERNAL_URL: http://agent-engine:8001
      # 本 worktree 的 git 分支名（Makefile export）→ /health dev_label，
      # DebugPanel 的 Connected backend 卡靠它分辨手机连的是哪个 worktree。
      PINAI_DEV_LABEL: ${PINAI_DEV_LABEL:-}
    ports:
      - "8000"
    healthcheck:
      test:
        ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ── backend CHAT process group ──
  # Untrusted runtime: runs DeepAgents / LangGraph LLM loop. Same image as
  # api; entrypoint flipped to chat/asgi which fail-fasts on master
  # credential leak. Step F-1 will swap APIs proxy target to call web first
  # and have web HS256-sign + forward to here.
  agent-engine:
    build: *pinai-build
    image: backend:latest
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    env_file:
      # Chat-only env: master credentials stripped (PAI_HMAC_SECRET,
      # DATABASE_URL, COMPOSIO_API_KEY, STRIPE_*). Auto-derived from
      # .env in `make ensure-env-backend`. The trust-boundary
      # fail-fast in agent_engine/asgi.py crashes if any leak in.
      - ./backend/.env.chat
    environment:
      ENTRYPOINT_MODULE: agent_engine.asgi:app
      ENTRYPOINT_PORT: "8001"
      LITELLM_BASE_URL: http://litellm:4000/v1
      # LangGraph checkpointer Postgres URL — separate role from web's
      # service_role (post-migration 024_pai_chat_role.sql).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      WEB_INTERNAL_URL: http://api:8000
      # PAI_API_URL is what python_exec injects into the Daytona sandbox
      # so pinai_sdk can call /api/agent/*. The compose internal URL
      # (api:8000) only resolves inside this docker network — a
      # cloud sandbox can't reach it. For real SDK usage, override via
      # `make tunnel-up`, which puts a public ngrok URL in shell env
      # (sourced from ./.env). Default keeps internal URL so chat still
      # boots when the tunnel is down.
      PAI_API_URL: ${PAI_API_URL:-http://api:8000}
      # Local-only generator debug path: run DeepAgents code execution in
      # the chat container instead of Daytona so pinai_sdk can use docker DNS.
      PINAI_LOCAL_SANDBOX: ${PINAI_LOCAL_SANDBOX:-0}
      # Daytona sandbox source. Default to the local-dev snapshot: `make up` /
      # `make restart` rebuild it (scripts/ensure_daytona_snapshot.sh) whenever
      # the sandbox inputs (packages/pinai_sdk + builder def) change, so local
      # runs always test the latest SDK with ~1s sandbox creates. Do NOT point
      # local at pinai-sandbox:{dev,test,production} — those are CI-owned and
      # delete+recreated on every deploy. Without a snapshot (set
      # PINAI_DAYTONA_SNAPSHOT= empty), every cold create falls back to the
      # declarative image-build path, which can stall in Daytona
      # `pending_build` indefinitely and time out at 150s — this breaks the
      # oneshot path used by /agent/run/evolve and /generate (LazyThreadSandbox
      # in chat/history honors PINAI_LOCAL_SANDBOX instead, but the oneshot
      # path does not).
      PINAI_DAYTONA_SNAPSHOT: ${PINAI_DAYTONA_SNAPSHOT-pinai-sandbox:local}
    ports:
      - "8001"
    healthcheck:
      test:
        ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # ── reward-dashboard service (internal review tool backend) ──
  # Standalone untrusted service: read-only product DB + langsmith, NO master
  # credentials (env_file = .env.chat, master stripped — same as agent-engine).
  # Serves the read-only review routes /api/reward-dashboard/*; impersonation's
  # master-cred route stays in the api service under /api/operator/*. The
  # internal-reward-dashboard Vite app proxies by prefix to both (see its
  # vite.config). Nothing depends_on it — only needed when working on the
  # internal-reward-dashboard app.
  reward-dashboard:
    build: *pinai-build
    image: backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env.chat
    environment:
      ENTRYPOINT_MODULE: pinai_reward_dashboard.asgi:app
      ENTRYPOINT_PORT: "8002"
      # Local superuser DSN; the scoped read-only role is a deploy-time TODO
      # (backend/deploy/fly-split/README.md § DB roles).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    ports:
      - "8002"
    healthcheck:
      test:
        ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # apps/web — zebra 桌面 web 端 SPA（nginx same-origin /api 反代 api:8000，
  # 见 apps/web/Dockerfile）。web build 用空 base，不需要 VITE_PIN_API_URL。
  # host 端口随机，`make urls` 查 Web 行。
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        WORKDIR: apps/web
        NODE_BASE_IMAGE: ${PINAI_NODE_BASE_IMAGE:-node:20-slim}
        NGINX_BASE_IMAGE: ${PINAI_NGINX_BASE_IMAGE:-nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    image: proactive-ai-web:latest
    restart: unless-stopped
    environment:
      NGINX_RESOLVER: "127.0.0.11 ipv6=off"
      NGINX_UPSTREAM_URL: "http://api:8000"
    ports:
      - "8080"
    depends_on:
      api:
        condition: service_healthy

  # ── ngrok tunnel (opt-in via --profile tunnel) ──
  # Exposes api:8000 to the public internet so Daytona cloud
  # sandboxes can reach the SDK endpoints (/api/agent/*). Only needed
  # for local development of the generator/dreaming agents; chat without
  # python_exec works fine without this.
  #
  # NGROK_AUTHTOKEN comes from project-root ./.env (decrypted from the
  # checked-in ./.env.dev). The --url below binds this group's stable
  # .ngrok.app subdomain; `make tunnel-up` reads the live URL from the :4040
  # API (on a random host port) and injects it as PAI_API_URL. See
  # scripts/ngrok_url.sh.
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command:
      - "http"
      - "api:8000"
      # Per-worktree subdomain (paid plan): each group gets a distinct, stable
      # .ngrok.app URL = its project name, so multiple worktrees / teammates on
      # the shared token never collide on the single dev domain (ERR_NGROK_334).
      - "--url=https://${COMPOSE_PROJECT_NAME}.ngrok.app"
      - "--log=stdout"
    ports:
      # ngrok inspector / local API (random host port — see make tunnel-up).
      - "4040"

volumes:
  pgdata:
