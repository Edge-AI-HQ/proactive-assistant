services:
  # ── Database ──
  postgres:
    image: postgres:15-alpine
    container_name: pin-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Database migration (runs once, then exits) ──
  db-migrate:
    image: postgres:15-alpine
    container_name: pin-ai-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./apis/db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating litellm database..."
        psql -h postgres -U postgres -d postgres -c "SELECT 1 FROM pg_database WHERE datname='litellm'" | grep -q 1 \
          || psql -h postgres -U postgres -d postgres -c "CREATE DATABASE litellm;" 2>&1
        echo "Running app migrations..."
        for f in $$(ls /migrations/*.sql | sort); do
          echo "  Applying $$(basename $$f)..."
          psql -h postgres -U postgres -d postgres -f "$$f" 2>&1 || true
        done
        echo "Migrations complete."

  # ── LiteLLM proxy ──
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-v1.82.0.dev1
    container_name: pin-ai-litellm
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - ./ops/litellm/.env
    environment:
      # Override DB URL to use local postgres (takes precedence over env_file)
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/litellm
    ports:
      - "4000:4000"
    volumes:
      - ./ops/litellm/litellm_config.yaml:/app/config.yaml:ro
    command:
      ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 120s

  # ── APIs ──
  apis:
    build:
      context: .
      dockerfile: apis/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: pin-ai-apis
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    env_file:
      - ./apis/.env
    environment:
      # Local overrides (take precedence over env_file)
      - SUPABASE_DB_URL=postgresql://postgres:postgres@postgres:5432/postgres
      - CONTAINER_RUNTIME=docker
      - OPENCLAW_IMAGE=pinai-openclaw:latest
      - MOBILE_SYNC_PROXY_ENABLED=1
      - LITELLM_BASE_URL=http://host.docker.internal:4000
      # pinai-agents (Step 1.7): /api/proxy/generate and /chat-stream/*
      # forward here. Service-name DNS within the docker network.
      - PINAI_AGENTS_URL=http://pinai-agents:8000
      # Docker-out-of-Docker: tell APIs the host-side data path
      - HOST_DATA_DIR=${PWD}/data
      - DOCKER_HOST_ADDRESS=host.docker.internal
      # Dev: every request maps to a single fixed local user (no token,
      # no Supabase). Production unaffected (NODE_ENV=production gates it).
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/apis/data

  # ── OpenClaw image (build only, no running container) ──
  openclaw-image:
    build:
      context: .
      dockerfile: pinai-openclaw/image/Dockerfile
    image: pinai-openclaw:latest
    entrypoint: ["true"]
    restart: "no"

  # ── pinai-agents (Python LangChain + DeepAgents service) ──
  # Hosts the proactive-ai agents (generator / chat) replacing OpenClaw's
  # in-container runtime. APIs forwards /api/proxy/generate and
  # /chat-stream/* to this service. See docs/plans/2026-05-04-step1-deepagents-skeleton.mdx.
  pinai-agents:
    build:
      context: ./pinai-agents
      dockerfile: Dockerfile
      args:
        DEPLOY_ENV: dev
    container_name: pin-ai-pinai-agents
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    env_file:
      - ./pinai-agents/.env
    environment:
      # Override the .env.dev default: in compose litellm is reachable via
      # service-name DNS, in fly we point to the prod URL via env.
      - LITELLM_BASE_URL=http://litellm:4000/v1
      # LangGraph checkpointer Postgres URL (Step 1.4). Schema-isolated
      # under `langgraph` so checkpoints don't pollute public.
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  pgdata:

networks:
  default:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
        - subnet: fd00:18::/64
