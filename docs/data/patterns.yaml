  # ----- A. routine_observation(节律识别)5 条 -----
  - id: routine_anchor_detected
    category: routine_observation
    abstract: 从历史信号中识别出用户稳定的日常节律,主动告知并询问是否要协助
    signals: [gps.history_window]
    trigger:
      - { op: trajectory_similarity_gte, source: gps.workday_morning, days: 5, threshold: 0.8 }
    intent: routine_assistance
    card_skeleton:
      hook: 把识别出的节律具体描述
      why_now: 引用观察到的天数和稳定度
      evidence: gps history range
      action: 提议加入提醒或确认节律
    specializations:
      - subtype: commute_route
      - subtype: gym_schedule
      - subtype: evening_unwind_route
      - subtype: weekend_anchor
    surprise: h
    practical: h
    tier: warmup

  - id: meal_pattern_inferred
