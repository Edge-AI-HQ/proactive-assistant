# Pattern Library v0 — 100 条 abstract pattern
#
# 设计原则:
# 1. abstract pattern 定义的是"用户认知/行为模式",不是 entity subtype
# 2. signal subtype 通过 specializations 字段参数化,不在 pattern 层展开
# 3. trigger 是结构化 DSL,可被 Python evaluator 直接求值(不走 LLM)
# 4. card_skeleton 是骨架,LLM 在 generator 里填血肉
# 5. surprise / practical level 是人工初评,后续由 reward ledger 校准
#
# 字段说明:
#   id              全局唯一 slug,DB 主键
#   category        大类,管理用
#   abstract        一句话说明该 pattern 描述什么认知模式
#   signals         触发需要的 signal source(对应 signal ontology)
#   trigger         结构化 DSL,所有 conditions AND
#   intent          产生卡片的意图,planner 用
#   card_skeleton   生成阶段约束 LLM 的结构
#   specializations 该 pattern 在不同 signal subtype 下的参数化
#   surprise        h/m/l — 用户被 wow 程度的初评
#   practical       h/m/l — 用户实用价值的初评
#   tier            cold_start_friendly(day-1 可发) / warmup(7d+) / mature(30d+)
#
# 引用: docs/plans/2026-05-15-pattern-driven-card-generation.mdx

version: v0
generated_at: 2026-05-15
total_patterns: 100

# ===================================================================
# Signal Ontology(被 pattern 引用的 signal 树)
# ===================================================================
ontology:
  gps:
    current: [lat, lng, accuracy, timestamp, dwell_min, cluster_id, place_label]
    history_window: [days_lookback, clusters, visit_freq, last_visit_at]
    inferences: [commute_route, home_cluster, office_cluster, frequent_places, weekend_cluster]
  calendar:
    event:
      attrs: [title, start, end, location, attendees, organizer, is_recurring]
      subtypes:
        work: [meeting_1on1, meeting_team, meeting_external, deadline, travel]
        personal: [medical, social, family, errand]
        transit: [flight_intl, flight_dom, train, drive]
    derived: [density_today, conflict_pairs, free_slots]
  gmail:
    message:
      attrs: [from, subject, body_summary, received_at, has_attachment, is_unread]
      subtypes:
        transactional: [receipt, reservation_hotel, reservation_flight, reservation_restaurant, shipping, deadline_billing, expiring_rewards]
        personal: [from_close_contact, from_family, from_vip]
        work: [from_colleague, from_external, from_mentor]
        newsletter: [subscribed, unsubscribed]
    derived: [unresponded_to_vip, recurring_correspondent, dormant_thread]
  chat:
    history: [thread_id, last_msg_at, msg_count_30d, topics_extracted]
    derived: [repeating_topic_no_action, promised_followup_open]
  feedback:
    intent_state: [intent, basket, dismiss_count_30d, confirm_count_30d, last_action_at]
    derived: [ick_list, hot_intents]
  device:
    health: [steps, sleep_h, hrv, screen_time, workout_session]
    ambient: [audio_event, location_event, motion_event]
  world:
    weather: [forecast_24h, forecast_7d, current_at_user_location]
    transit_status: [route_disruptions, traffic_unusual]
    public_data: [places_nearby, events_local, deals_local]
  profile:
    static: [age_range, family_role, work_role, languages, dietary]
    preferences: [hobby_tags, dislike_tags]
  memory:
    facts: [user_facts, recurring_obligations]
    skills: [practiced_skills, learning_goals]

