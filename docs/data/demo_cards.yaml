  # ===== C. time_buffer_risk =====
  - pattern_id: time_buffer_commute
    scenario: 用户 10:30 在家,11:00 有线下会议,实时路况看下来到不了
    card:
      hook: 11 点会议你赶不上了
      body: |
        现在到会议地点路况显示 38 分钟,你还在家 — 即使立刻出门也迟到 8 分钟。
        会议地点离地铁 5 分钟,坐 13 号线快 6 分钟,但要现在走。
      action: 帮你给主持人发"迟到 5 分钟"?
    signals_used: [gps.current, calendar.event, world.transit_status]
    why_surprise: 系统主动算时间差,不等用户算
    why_practical: 救场
    wow_level: 4

  - pattern_id: time_buffer_weather_delay
    scenario: 1 小时后用户要去望京客户,北京突降暴雨
    card:
      hook: 暴雨,1 小时后的会议要不要改远程
