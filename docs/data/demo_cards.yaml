      action: 提前 16:15 提醒结束会议?
    signals_used: [calendar.event.transit.flight_dom, gmail.message.transactional, world.weather]
    why_surprise: 把"会议结束"和"航班出发"链起来
    why_practical: 防止迟到的具体时间锚点
    wow_level: 4

  - pattern_id: preparation_gap_social_dinner
