# Demo Card Library v0 — 105 张卡(1:1 对应 patterns.yaml)
#
# 用途:
# 1. seed 内部 dashboard 让团队看到"pattern 库跑起来是什么样"
# 2. 进 generator 的 few-shot 例子库,每个 pattern 配 1-3 张
# 3. 作为"普通人视角 surprise + 实用"的人工初评基线
#
# 格式约定:
#   pattern_id      对应 patterns.yaml 的 id(必填)
#   subtype         如果该 demo 是 pattern 的某 specialization(选填)
#   scenario        触发场景的描述,普通人视角
#   card            用户实际看到的卡片
#     hook          一句话点出关键
#     body          2-3 句完整说明
#     action        具体可点动作
#   signals_used    这张卡用到了哪些 signal(用于工程对照)
#   why_surprise    为什么用户会被打动
#   why_practical   为什么对用户真有用
#   wow_level       1-5(人工初评,后续由 reward ledger 校准)
#
# 引用: docs/plans/2026-05-15-pattern-driven-card-generation.mdx

version: v0
generated_at: 2026-05-15
total_cards: 105

demos:

  # ===== A. routine_observation =====
  - pattern_id: routine_anchor_detected
    subtype: commute_route
    scenario: 用户连续 5 个工作日 GPS 在 8:00-9:30 走几乎一样的路径
    card:
      hook: 我看出你上班路径了
      body: |
        早上 8:30 从紫荆苑附近出门,9:05 到中关村南,平均路上 35 分钟 — 过去 5 天都这样。
        明天周一有暴雨,这条路常堵 15 分钟。
      action: 明早 8:15 提前提醒出门?
    signals_used: [gps.history_5d, world.weather.forecast_24h]
    why_surprise: 你从没说过住哪、在哪上班,系统自己推出来的
    why_practical: 具体到分钟,不是泛泛"早点出门"
    wow_level: 5

  - pattern_id: meal_pattern_inferred
    subtype: lunch_cluster
    scenario: 用户连续 10 个工作日 12:30-13:00 在公司楼下区域停留
    card:
      hook: 你的午餐窗口稳定在 12:30-13:00
      body: |
        过去 10 天都在公司楼下 200m 内吃,主要去 3 家 — 老地方面、便当君、肯德基。
        今天你 12:00 有会议跨到 13:15,午餐窗口被吃掉了。
      action: 帮你 11:30 点外卖到会议室?
    signals_used: [gps.history_10d, calendar.event]
    why_surprise: 系统识别出"午餐节律被工作打破"这种细微状态
    why_practical: 给出立刻可点的解决方案
    wow_level: 4

  - pattern_id: sleep_rhythm_inferred
    subtype: workweek_pattern
    scenario: 端侧健康数据显示用户工作日凌晨 1 点睡 7 点起
    card:
      hook: 你最近 14 天平均睡 6 小时
      body: |
        工作日凌晨 1 点睡、7 点起,周末补到 9 小时 — 这是典型 "周中亏 + 周末还" 模式。
        研究上这模式 4 周以上对认知有影响。
      action: 看这周怎么提前 30 分钟睡?
    signals_used: [device.health.sleep_h]
    why_surprise: 系统看穿了"周中亏周末还"这个用户自己都没意识到的模式
    why_practical: 给出有数据基础的健康提醒
    wow_level: 4

  - pattern_id: workweek_pattern_inferred
    subtype: meeting_density
    scenario: 过去 3 周用户每周二、周四都是会议密集日(8 个以上会议)
    card:
      hook: 你的周二和周四,过去 3 周都是会议日
      body: |
        这两天平均 8.3 个会议,周一/三/五平均 3 个 — 重型工作其实只发生在周三和周五。
      action: 把周二/四的深度工作时段挪走?
    signals_used: [calendar.event, gps.history_window]
    why_surprise: 系统从原始日程中提炼出"哪天是真工作日"的模式
    why_practical: 直接帮用户重新安排深度工作时段
    wow_level: 4

  - pattern_id: weekend_ritual_detected
    subtype: cafe_visit
    scenario: 过去 4 个周末用户都在某咖啡馆停留 2h+,这周末还没去
    card:
      hook: 你上 4 个周六下午都去 Seesaw 写东西
      body: |
        今天周六下午 2 点了 — 你还没出门,日程也没安排。
        天气晴,Seesaw 现在不挤(实时人流低)。
      action: 留个位?
    signals_used: [gps.history_4w, world.weather, world.public_data]
    why_surprise: 系统知道你的"周末仪式",而且能感觉到今天的偏离
    why_practical: 帮你保持你自己说不出但很在意的小习惯
    wow_level: 5

  # ===== B. preparation_gap =====
  - pattern_id: preparation_gap_medical
    subtype: general_checkup
    scenario: 用户明天上午 9:30 协和医院常规体检
    card:
      hook: 明早 9:30 体检 — 这几件容易忘
      body: |
        你协和的体检是空腹项目(去年报告说要做血脂复查),今晚 8 点后别吃东西。
        往年的报告需要带原件,记得放包里。
      action: 设 6 点起床闹钟 + 8 点禁食提醒?
    signals_used: [calendar.event.personal.medical, memory.facts]
    why_surprise: 系统记得去年的报告需要复查这件事
    why_practical: 把"模糊知道要准备"变成"具体三件事"
    wow_level: 4

  - pattern_id: preparation_gap_meeting
