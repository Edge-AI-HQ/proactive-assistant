        现在中心城区暴雨橙色预警,东三环已堵。
        客户那边今早邮件里提到他在家办公,他大概率不在公司 — 改 Zoom 反而更稳。
      action: 帮你发"改远程"消息?
    signals_used: [world.weather, calendar.event, gmail.message]
    why_surprise: 不只是看天气,还结合"客户其实在家"这个证据
    why_practical: 解决"要不要改远程"的真实犹豫
    wow_level: 5

  - pattern_id: time_buffer_transit_disruption
    scenario: 用户常坐的 10 号线晚高峰出故障
    card:
      hook: 你常坐的 10 号线晚高峰停了
      body: |
        你过去 30 天有 22 次晚上坐 10 号线回家。
        今天 18:00 起 10 号线西段停运,预计恢复 19:30。
        替代:1 号线转 6 号线 +12 分钟。
      action: 改打车?现在出门预计 35 分钟到家
    signals_used: [world.transit_status, gps.inferences.commute_route]
    why_surprise: 系统知道"你常坐 10 号线"
    why_practical: 给出具体替代路径
    wow_level: 5

  - pattern_id: time_buffer_multi_event_squeeze
    scenario: 用户今天 5 个连续会议,每个间隔 5 分钟
    card:
      hook: 今天 5 连开,中间没饭
      body: |
        9:00-10:00 / 10:05-11:00 / 11:00-12:00 / 13:00-14:00 / 14:00-15:00 — 没有真正空档。
        其中 11 点那场你可以试着取消(只有 2 人 + 议题非紧急)。
        15 点之后你才有空吃饭 — 现在订外卖到办公室?
      action: 帮你查 11 点会议可否后延?
    signals_used: [calendar.event]
    why_surprise: 系统主动诊断"哪场会能砍"
    why_practical: 切实减少今天的压力
    wow_level: 5

  - pattern_id: time_buffer_prep_window_closing
