        你最近这周的产品上线邮件他全在 cc — 估计想聊融资节奏。
      action: 帮你整理 3 页 brief?
    signals_used: [calendar.event, gmail.message]
    why_surprise: 系统把"他要聊什么"从邮件里推断出来
    why_practical: 直接给出可执行的 brief 生成 action
