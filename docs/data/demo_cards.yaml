        班主任王老师今早邮件说今天可以晚 15 分钟接。
      action: 给王老师发"晚 5 分钟"消息?
    signals_used: [calendar.event.personal.family, gps.current, gmail.message]
    why_surprise: 系统记得老师早上邮件里的"宽限"
    why_practical: 救场 + 不慌
