    scenario: AI 创业相关 networking,本周举办
    card:
      hook: 周三晚有场 AI 创业小聚
      body: |
        在 [那家咖啡馆],8-10 点。
        参加者预估 30 人,有 2 个你 chat 提过的人。
        你周三晚日历空。
      action: 帮你报名 + 备 self intro?
    signals_used: [world.public_data, profile.static, chat.history, gps.current]
    why_surprise: 系统知道"现场会有谁"
    why_practical: 主动 networking
    wow_level: 4

  - pattern_id: opp_seasonal_match
    scenario: 滑雪季开始,用户去年滑过几次
    card:
      hook: 崇礼今天开板了
      body: |
        你去年滑过 4 次,后面三次都在崇礼。
        今天首日早鸟票折扣 4 月没用完的可以叠加。
        这周末有空。
      action: 帮你订周六票?
    signals_used: [profile.preferences, world.public_data, memory.facts]
    why_surprise: 系统记得去年滑了 4 次
    why_practical: 季节性爱好不错过
    wow_level: 5

  # ===== P. reflection =====
  - pattern_id: reflection_week
    scenario: 周日晚上,本周复盘窗口
    card:
      hook: 这周回顾
      body: |
        你这周关键 3 件 —
        - 完成了拖了 2 周的方案(周四提交)
        - 和老 L 那次咖啡谈得很深
        - 健身断了 — 周三晚饭那次本来该去
        三问 — 哪件最有价值?哪件本来可以更好?下周第一件事?
      action: 帮你写 3 行下周锚点?
    signals_used: [calendar.event, chat.history, device.health]
    why_surprise: 系统挑出"本周关键 3 件"
    why_practical: 复盘节奏
    wow_level: 3

  - pattern_id: reflection_month
    scenario: 月末
    card:
      hook: 5 月总结
      body: |
        本月你 — 完成 X 个 milestone / 旅行 1 次 / 学到的新东西 3 件(chat 提过)/ 健身 12 次 / 读完 1 本书。
        最有价值的一件 — 你自己说一下?
      action: 帮你出 5 月 review markdown?
    signals_used: [calendar.event, chat.history, gmail.message, device.health]
    why_surprise: 系统量化"这个月你做了什么"
    why_practical: 月度自我认知
    wow_level: 4

  - pattern_id: reflection_post_event
    scenario: 用户完成一场重要 demo 后
    card:
      hook: 刚才 demo 怎么样?
      body: |
        听众 35 人 — 你之前 chat 提到担心问答环节。
        三问 —
        - 最满意的一点?
        - 下次会改什么?
        - 学到的最大一件事?
      action: 帮你写 3 行 retro?
    signals_used: [calendar.event, chat.history]
    why_surprise: 系统记得"你担心问答环节"
    why_practical: 学习沉淀
    wow_level: 4

  - pattern_id: reflection_trip_memory
    scenario: 用户东京出差刚回北京
    card:
      hook: 东京回来了 — 趁记得整理一下
      body: |
        5 天里你去了 8 个地方,平均日步数 18000,拍了 200+ 张照片。
        印象最深 3 个地方(从你 chat 推测)— 浅草 / 涉谷 / 那家拉面。
      action: 帮你整理 trip recap?
    signals_used: [gps.history_window, calendar.event, gmail.message, chat.history]
    why_surprise: 系统帮你回忆"印象最深的 3 个地方"
    why_practical: 旅行记忆固化
    wow_level: 5

  # ===== Q. warning =====
  - pattern_id: warn_silent_deadline
    scenario: 用户 3 天后 ddl,文档零进度
    card:
      hook: 那份方案 3 天后交 — 还没开
      body: |
        相关 doc 上次编辑 5 月 8 日(2 周前)。
        相关邮件还没起草。
        今天下午 14-17 点你空 — 这是最早能开的窗口。
      action: 帮你阻断 14-17?
    signals_used: [calendar.event, gmail.message, chat.history]
    why_surprise: 系统识别"零启动状态"
    why_practical: 救火
    wow_level: 4

  - pattern_id: warn_pet_plant_neglect
    scenario: 用户的猫 4 天没记录喂食
    card:
      hook: 米饭(猫)上次喂记 4 天前
      body: |
        你之前 chat 提过 "每周三换水 + 周日补猫粮"。
        今天周一 — 周末你回老家了 4 天没在。
      action: 提醒今晚回家先看猫?
    signals_used: [memory.facts, calendar.event, gps.history_window]
    why_surprise: 系统记得"你定的喂食 ritual"
    why_practical: 真实关心
    wow_level: 4

  - pattern_id: warn_device_low_battery_critical
    scenario: 用户笔记本 15% 电量,30 分钟后有会议
    card:
      hook: 笔记本 15% — 30 分钟后会议
      body: |
        你常用的会议室没插座。
        充电器 — 你今早离开桌面没带(你昨天 chat 提到放在桌左侧抽屉)。
      action: 提醒回桌取充电器?
    signals_used: [device.health, calendar.event, chat.history, gps.current]
    why_surprise: 系统记得"充电器在哪"
    why_practical: 避免会议中断
    wow_level: 4

  - pattern_id: warn_backup_overdue
    scenario: 用户照片备份上次是 45 天前
    card:
      hook: 你照片备份 45 天没动
      body: |
        过去 30 天你新拍 240 张。
        iCloud 还有 22GB,不到 50% — 够装。
        现在 WiFi 强 + 充电中 — 适合开。
      action: 帮你启动备份?
    signals_used: [memory.facts, device.health]
    why_surprise: 系统识别"风险窗口" + 适合的时机
    why_practical: 防丢
    wow_level: 3

  # ===== R. energy_management =====
  - pattern_id: energy_high_morning_match
    scenario: 用户早晨高能时段 + 有深度任务待做
    card:
      hook: 现在你脑子最清楚
      body: |
        过去 14 天你早 8:30-10:30 完成的事质量普遍最高(你自评)。
        你那份方案要写 — 现在动比下午动效率高 2x。
      action: 帮你设 90 分钟专注?
    signals_used: [device.health, calendar.event, memory.facts]
    why_surprise: 系统识别"个体最佳时段"
    why_practical: 利用黄金时间
    wow_level: 4

  - pattern_id: energy_low_simple_task
    scenario: 用户下午 3 点能量低 + 有几个简单 errand 可以做
    card:
      hook: 现在状态低,适合做简单事
      body: |
        过去 14 天你下午 3-4 点效率均值 -30%。
        你有 3 件不动脑的事可以做 —
        - 回那 5 封 OK 邮件
        - 取个快递
        - 看 newsletter 收件箱
      action: 帮你从哪个开始?
    signals_used: [device.health, calendar.event, memory.facts, gmail.message]
    why_surprise: 系统识别"该做啥根据状态"
    why_practical: 不浪费低能时段
    wow_level: 4

  - pattern_id: energy_weekend_recharge
    scenario: 用户一周身体指标全部下行,周末来了
    card:
      hook: 这周身体所有指标下行 — 周末该真休息
      body: |
        睡眠 -1.2h / 步数 -30% / 心率 +5bpm / 工时 +25%。
        过去出现这组合后 — 下周一通常 brain fog。
        建议周六完全离开屏幕。
      action: 帮你周六设全天勿扰?
    signals_used: [device.health, calendar.event]
    why_surprise: 系统识别"过载模式"并给具体处方
    why_practical: 拯救下周
    wow_level: 4
