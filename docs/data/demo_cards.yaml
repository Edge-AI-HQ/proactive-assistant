    card:
      hook: 12 小时后飞东京 — 几件容易漏
      body: |
        你护照过期日是 8 月(还有 4 个月,OK)。
        东京下周三全城雨,带伞。
        携程订的新宿酒店离机场 50 分钟,落地后早高峰 +15 分钟。
        现在汇率 100 円 = 4.8 元,日本卡余额你上次说还有 6 万円。
      action: 帮你列完整登机前 clipboard?
    signals_used: [calendar.event.transit.flight_intl, gmail.message.transactional.reservation_flight, profile.static.languages, world.weather, memory.facts]
    why_surprise: 5 件互不相关的事被串成"出门 checklist"
    why_practical: 每一项都是用户当下要决策的
    wow_level: 5

  - pattern_id: preparation_gap_travel_dom
