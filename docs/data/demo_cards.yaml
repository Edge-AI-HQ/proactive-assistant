        那家餐厅在你周五下班路线上 — 提前订位不绕路。
      action: 帮你订 19:30?
    signals_used: [gmail.message.transactional.expiring_rewards, gps.inferences.commute_route, calendar.event]
    why_surprise: 3 件不相关的事被连起来 — 这是 personal AI 真正的 wow
