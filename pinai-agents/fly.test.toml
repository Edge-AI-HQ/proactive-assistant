app = 'proactive-ai-agents-test'
primary_region = 'iad'

# Mirrors fly.dev.toml. Two changes:
#   1. app name + DEPLOY_ENV = 'test'
#   2. min_machines_running stays at 1 (test env, no warmup requirement)
#
# Test env hosts an isolated Supabase project; upstream SDK keys
# (LiteLLM master, Daytona, Composio, Stripe, ElevenLabs) are reused
# from dev — see docs/modules/runtime-deployment.mdx § test 环境.

[build]
  dockerfile = 'Dockerfile'

[env]
  DEPLOY_ENV = 'test'
  # Inter-process URLs — code defaults to docker-compose service names
  # (`pinai-web` / `pinai-chat`) which don't resolve on fly's 6PN.
  # web and chat have asymmetric exposure needs, so they use different
  # transport paths:
  #   * chat→web: public anycast (HTTPS). web must be public-facing for
  #     the Daytona sandbox callback (PAI_API_URL); reusing that URL
  #     here keeps one entry point for everyone reaching web. fly-proxy
  #     edge short-circuits same-region traffic, ~1ms overhead.
  #   * web→chat: 6PN service-discovery direct (HTTP/IPv6). chat must
  #     NOT be reachable from the public internet — it runs the LLM
  #     loop with virtual_key + Daytona token. Fly's flycast can't be
  #     restricted to internal-only on apps that also have a public IP
  #     (allocating `[[services.ports]]` exposes the same port on
  #     anycast too). 6PN direct skips fly-proxy entirely; chat binds
  #     `--host ::` so only IPv6 service-discovery callers can reach
  #     it, and there is no anycast listener to route public traffic.
  WEB_INTERNAL_URL = "https://proactive-ai-agents-test.fly.dev"
  CHAT_INTERNAL_URL = "http://chat.process.proactive-ai-agents-test.internal:8001"
  # Daytona sandboxes run OUTSIDE fly's 6PN — they can't resolve
  # *.internal hostnames. PAI_API_URL is what chat injects into each
  # sandbox so pinai_sdk inside (client.profile.get / signals / raw
  # / memory) can call back to web. Must be the public anycast URL.
  PAI_API_URL = "https://proactive-ai-agents-test.fly.dev"
  # LiteLLM lives in a separate fly app. Going through public anycast
  # (HTTPS) instead of 6PN — the LiteLLM container binds 0.0.0.0
  # (IPv4 only) and 6PN is IPv6 only, so internal would refuse.
  # Public hop is ~negligible for /user/new and /key/generate admin
  # ops, fine for embed + completion too in test.
  LITELLM_BASE_URL = "https://proactive-ai-litellm-test.fly.dev/v1"
  # Daytona snapshot — a pre-baked image of `infra/daytona/Dockerfile`
  # (slim Python 3.12 + pinai_sdk preinstalled). Without this set,
  # sandbox.py falls back to declarative image build, which costs
  # ~30-50s per first sandbox in a 24h cache window and shows up as
  # a "first message hangs forever" UX. Deploy Test builds /
  # refreshes this snapshot on every run, so the tag is stable across
  # SDK version bumps — see .github/workflows/deploy-test.yml
  # build-daytona-snapshot job.
  PINAI_DAYTONA_SNAPSHOT = "pinai-sandbox:test"

[processes]
  # Secrets come from `flyctl secrets set --process-group=<web|chat> ...` —
  # chat MUST NOT receive master credentials. See fly.dev.toml comment
  # block for the full trust-boundary rationale.
  #
  # Asymmetric host bind matches asymmetric exposure (see [env] comment):
  #   * web `0.0.0.0` (IPv4): fly-proxy public anycast forwards
  #     same-machine over IPv4. Without IPv4, public traffic gets
  #     `[PC01] instance refused connection`.
  #   * chat `::` (IPv6): only reachable over Fly's IPv6-only 6PN
  #     service-discovery DNS. No fly-proxy listener (no [[services]]
  #     ports = anycast), so the public internet has no path in.
  web  = "uvicorn pinai_agents.web.asgi:app --host 0.0.0.0 --port 8000"
  chat = "uvicorn pinai_agents.chat.asgi:app --host :: --port 8001"

# Public HTTPS edge → web only. All inbound web traffic (sandbox
# callbacks, frontend nginx /api/* proxy, chat→web internal calls)
# enters here, so this is the single anycast listener for web.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 80
    soft_limit = 50

# chat has NO fly-proxy services entry on purpose. Reachable only via
# Fly's 6PN service-discovery DNS (chat.process.<app>.internal:8001),
# which routes IPv6 directly to the chat machine — never through
# fly-proxy. Adding `[[services.ports]]` here would expose chat on
# both flycast AND public anycast (you cannot restrict to flycast on
# an app that has any public IP), which would leak the LLM loop +
# its credentials to the internet.

[deploy]
  release_command = "sh -c 'exec yoyo apply --batch -d \"postgresql+psycopg://${DATABASE_URL#*://}\"'"
  strategy = 'rolling'

[[vm]]
  processes = ['web']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[[vm]]
  processes = ['chat']
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
