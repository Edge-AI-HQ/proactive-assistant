app = 'proactive-ai-agents-test'
primary_region = 'iad'

# Mirrors fly.dev.toml. Two changes:
#   1. app name + DEPLOY_ENV = 'test'
#   2. min_machines_running stays at 1 (test env, no warmup requirement)
#
# Test env hosts an isolated Supabase project; upstream SDK keys
# (LiteLLM master, Daytona, Composio, Stripe, ElevenLabs) are reused
# from dev — see docs/modules/runtime-deployment.mdx § test 环境.

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    DEPLOY_ENV = 'test'

[env]
  DEPLOY_ENV = 'test'
  # Inter-process URLs — defaults in code use docker-compose service
  # names (`pinai-web` / `pinai-chat`) which don't resolve on fly's
  # 6PN. Override with the per-process-group fly hostnames so:
  #   * chat → web   (sandbox phantom mints, native @tool callbacks)
  #   * web → chat   (browser SSE, scheduler dispatch, chat-stream)
  WEB_INTERNAL_URL = "http://web.process.proactive-ai-agents-test.internal:8000"
  CHAT_INTERNAL_URL = "http://chat.process.proactive-ai-agents-test.internal:8001"
  # Daytona sandboxes run OUTSIDE fly's 6PN — they can't resolve
  # *.internal hostnames. PAI_API_URL is what chat injects into each
  # sandbox so pinai_sdk inside (client.profile.get / signals / raw
  # / memory) can call back to web. Must be the public anycast URL.
  PAI_API_URL = "https://proactive-ai-agents-test.fly.dev"
  # LiteLLM lives in a separate fly app. Going through public anycast
  # (HTTPS) instead of 6PN — the LiteLLM container binds 0.0.0.0
  # (IPv4 only) and 6PN is IPv6 only, so internal would refuse.
  # Public hop is ~negligible for /user/new and /key/generate admin
  # ops, fine for embed + completion too in test.
  LITELLM_BASE_URL = "https://proactive-ai-litellm-test.fly.dev/v1"

[processes]
  # Secrets come from `flyctl secrets set --process-group=<web|chat> ...` —
  # chat MUST NOT receive master credentials. See fly.dev.toml comment
  # block for the full trust-boundary rationale.
  #
  # `--host ::` (IPv6 wildcard) is required so other fly machines can
  # reach this listener over 6PN — fly's private network is IPv6-only.
  # Linux dual-stack accepts IPv4 traffic on the same socket via
  # IPv4-mapped IPv6 addresses, so docker-compose / public-anycast IPv4
  # paths keep working. `--host 0.0.0.0` would silently break the
  # frontend nginx proxy_pass on 6PN with TCP RST.
  web  = "uvicorn pinai_agents.web.asgi:app --host :: --port 8000"
  chat = "uvicorn pinai_agents.chat.asgi:app --host :: --port 8001"

# Public HTTPS edge → web only.
#
# auto_stop_machines = false (NOT 'suspend'): the frontend nginx
# reaches web through fly's 6PN at web.process.<app>.internal:8000.
# Public requests trigger anycast proxy which wakes suspended
# machines, but 6PN traffic bypasses that proxy — DNS would still
# resolve to the suspended machine's IPv6 and nginx would get
# connection-refused (502). Keeping web always-on avoids the gap.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['web']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 80
    soft_limit = 50

# chat is reachable only on the internal 6PN at chat.process.app.internal:8001.
[[services]]
  protocol = 'tcp'
  internal_port = 8001
  processes = ['chat']

[deploy]
  release_command = "sh -c 'exec yoyo apply --batch -d \"postgresql+psycopg://${DATABASE_URL#*://}\"'"
  strategy = 'rolling'

[[vm]]
  processes = ['web']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[[vm]]
  processes = ['chat']
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
