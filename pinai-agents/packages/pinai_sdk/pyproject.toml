[project]
name = "pinai-sdk"
version = "0.1.0"
description = "Async Python client for Pin AI's /api/agent/* — for use inside agent sandboxes"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "anyio>=4.0.0",
]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinai_sdk"]
