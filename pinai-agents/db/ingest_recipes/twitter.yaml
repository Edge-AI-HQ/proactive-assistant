toolkit: twitter
slug: TWITTER_BOOKMARKS_BY_USER
args_template:
  id: "me"
  max_results: 100
  "tweet.fields": "created_at,lang,author_id"
  expansions: "author_id"
  "user.fields": "username,name"
since_param: null
since_format: null
result_path: [data]
id_field: id
sync_interval_hours: 24
description: "User's bookmarked tweets (highest signal-to-noise of the free Twitter API surface)."
notes: |
  - Composio stopped hosting Twitter credentials in Feb 2026; each tenant must bring its own OAuth2 app (with appropriate plan tier).
  - Double envelope: Composio wraps once, Twitter v2 wraps again — actual list is at response.data.data.
  - `id` MUST be 'me' or the authenticated user's id; passing a different user id returns HTTP 400.
  - Pagination via meta.next_token (cryptographically signed; never construct/modify).
  - Upgrade path: with paid Twitter Basic ($200/mo), swap to TWITTER_USER_HOME_TIMELINE_BY_USER_ID (since_id incremental, much higher signal); see twitter_paid.yaml.
