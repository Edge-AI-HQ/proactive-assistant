# ⚠️ READY BUT NOT ACTIVE — not referenced by any CI workflow. See README.md.
# Split-app variant of fly.dev.toml's `web` process group: the trusted API edge
# (holds master credentials). App name + URLs are PLACEHOLDERS — verify with ops.
app = 'proactive-ai-api-dev'
primary_region = 'iad'

[build]
  # build context = backend/ (flyctl deploy run from there, --config
  # pointing here). Dockerfile is the shared image; per-service Dockerfiles
  # (image isolation, §四 防线 2) are a later step — single image + per-app
  # secret already gives deploy-layer isolation.
  dockerfile = '../../Dockerfile'

[env]
  DEPLOY_ENV = 'dev'
  # api → engine: the engine app has NO public IP. Reach its uvicorn (binds
  # `::`:8001) directly over fly's 6PN service-discovery DNS — same model the
  # single app used for web→chat (chat.process.<app>.internal:8001), which is
  # proven for SSE (/agent/chat) because it skips fly-proxy entirely (no TLS
  # termination, no redirect, no streaming buffer). The engine app keeps its
  # machines always-on (auto_stop off) so 6PN never resolves a suspended host.
  CHAT_INTERNAL_URL = "http://proactive-ai-engine-dev.internal:8001"
  # Public anycast URL of THIS app — used for sandbox callbacks (PAI_API_URL)
  # and engine→api internal calls.
  WEB_INTERNAL_URL = "https://proactive-ai-api-dev.fly.dev"
  PAI_API_URL = "https://proactive-ai-api-dev.fly.dev"
  LITELLM_BASE_URL = "https://proactive-ai-litellm-dev.fly.dev/v1"
  PINAI_DAYTONA_SNAPSHOT = "pinai-sandbox:dev"

[processes]
  # Single process per app (the old web/chat [processes] split is now the
  # app split). Secrets = full set: sync_fly_secrets with no flags.
  app = "uvicorn pinai_api.asgi:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 80
    soft_limit = 50

[deploy]
  # ONLY the api app runs migrations — it holds the superuser DATABASE_URL.
  # engine/reward apps use scoped DSNs that can't migrate, by design.
  release_command = "sh -c 'exec yoyo apply --batch -d \"postgresql+psycopg://${DATABASE_URL#*://}\"'"
  strategy = 'rolling'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
