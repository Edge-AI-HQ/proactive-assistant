# ⚠️ READY BUT NOT ACTIVE — not referenced by any CI workflow. See README.md.
# Split-app variant of fly.test.toml's `web` process group: the trusted API edge
# (holds master credentials). App name + URLs are PLACEHOLDERS — verify with ops.
# Copied from fly.api.dev.toml; differences: app name (-test), all URLs (-test),
# DEPLOY_ENV='test', Daytona snapshot tag, and auto_stop_machines=false +
# VM size (2gb) matching the single-app fly.test.toml `web` group.
app = 'proactive-ai-api-test'
primary_region = 'iad'

[build]
  dockerfile = '../../Dockerfile'

[env]
  DEPLOY_ENV = 'test'
  # api → engine: the engine app has NO public IP. Reach its uvicorn (binds
  # `::`:8001) directly over fly's 6PN service-discovery DNS. NOTE: flycast:8001
  # is WRONG — flycast exposes the http_service external port (80/443), not the
  # container's 8001, so api→engine fails ConnectError. 6PN .internal hits the
  # container port directly, skips fly-proxy (no TLS/redirect/SSE-buffer) — the
  # same model the single app used for web→chat. (Verified on dev.)
  CHAT_INTERNAL_URL = "http://proactive-ai-engine-test.internal:8001"
  # Public anycast URL of THIS app — used for sandbox callbacks (PAI_API_URL)
  # and engine→api internal calls.
  WEB_INTERNAL_URL = "https://proactive-ai-api-test.fly.dev"
  PAI_API_URL = "https://proactive-ai-api-test.fly.dev"
  LITELLM_BASE_URL = "https://proactive-ai-litellm-test.fly.dev/v1"
  PINAI_DAYTONA_SNAPSHOT = "pinai-sandbox:test"

[processes]
  app = "uvicorn pinai_api.asgi:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  # test env mirrors fly.test.toml: keep the machine up (no suspend) so the
  # full-link manual deploys hit a warm app.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 80
    soft_limit = 50

[deploy]
  # ONLY the api app runs migrations — it holds the superuser DATABASE_URL.
  release_command = "sh -c 'exec yoyo apply --batch -d \"postgresql+psycopg://${DATABASE_URL#*://}\"'"
  strategy = 'rolling'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
