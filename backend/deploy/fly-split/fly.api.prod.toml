# ⚠️ READY BUT NOT ACTIVE — not referenced by any CI workflow. See README.md.
# Split-app variant of fly.prod.toml's `web` process group: the trusted API edge
# (holds master credentials). App name + URLs are PLACEHOLDERS — verify with ops.
# Copied from fly.api.dev.toml; differences: app name (-prod), all URLs (-prod),
# DEPLOY_ENV='production', Daytona snapshot tag, and VM size aligned to
# fly.prod.toml (api = 4gb).
app = 'proactive-ai-api-prod'
primary_region = 'iad'

[build]
  # build context = backend/ (flyctl deploy run from there, --config
  # pointing here). Dockerfile is the shared image; per-service Dockerfiles
  # (image isolation, §四 防线 2) are a later step — single image + per-app
  # secret already gives deploy-layer isolation.
  dockerfile = '../../Dockerfile'

[env]
  DEPLOY_ENV = 'production'
  # api → engine: the engine app has NO public IP. Reach its uvicorn (binds
  # `::`:8001) directly over fly's 6PN service-discovery DNS. NOTE: flycast:8001
  # is WRONG — flycast exposes the http_service external port (80/443), not the
  # container's 8001, so api→engine fails ConnectError. 6PN .internal hits the
  # container port directly, skips fly-proxy (no TLS/redirect/SSE-buffer) — the
  # same model the single app used for web→chat. Engine keeps machines always-on
  # (auto_stop off) so 6PN never resolves a suspended host. (Verified on dev.)
  CHAT_INTERNAL_URL = "http://proactive-ai-engine-prod.internal:8001"
  # Public anycast URL of THIS app — used for sandbox callbacks (PAI_API_URL)
  # and engine→api internal calls.
  WEB_INTERNAL_URL = "https://proactive-ai-api-prod.fly.dev"
  PAI_API_URL = "https://proactive-ai-api-prod.fly.dev"
  LITELLM_BASE_URL = "https://proactive-ai-litellm-prod.fly.dev/v1"
  PINAI_DAYTONA_SNAPSHOT = "pinai-sandbox:production"

[processes]
  # Single process per app (the old web/chat [processes] split is now the
  # app split). Secrets = full set: sync_fly_secrets with no flags.
  app = "uvicorn pinai_api.asgi:app --host 0.0.0.0 --port 8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 80
    soft_limit = 50

[deploy]
  # ONLY the api app runs migrations — it holds the superuser DATABASE_URL.
  # engine/reward apps use scoped DSNs that can't migrate, by design.
  release_command = "sh -c 'exec yoyo apply --batch -d \"postgresql+psycopg://${DATABASE_URL#*://}\"'"
  strategy = 'rolling'

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
