[project]
name = "pinai-reward-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
# Internal card-review tool. Trust: it can read the product `pai_*` schema
# but holds NO master credential (no Supabase secret key / JWT signing /
# Composio / Stripe / LiteLLM master). It depends only on the shared db leaf
# (pinai-db) + third-party libs, never on pinai-api — so it physically cannot
# reach the master-credential surface. Supabase auth is verify-only (httpx →
# /auth/v1/user); langsmith is read-only (materialize trace artifacts).
dependencies = [
  "pinai-db",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx[socks]>=0.28.1",
  "langsmith>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinai_reward_dashboard"]

[tool.uv.sources]
pinai-db = { workspace = true }
