[project]
name = "pinai-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pinai-contracts",
  "pinai-db",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langsmith>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "yoyo-migrations>=9.0.0",
  "croniter>=6.2.2",
  "pyjwt>=2.12.1",
  "cryptography>=48.0.0",
  "httpx[socks]>=0.28.1",
  "feedparser>=6.0.10",
  "bcrypt>=4.2.0",
  "supabase>=2.10.0",
  "stripe>=11.0.0,<13.0",
  "composio>=0.13.0",
  "aioapns>=4.0.0",
  "redis>=5.2.0",
  "opencc-python-reimplemented>=0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinai_api"]

[tool.uv.sources]
pinai-contracts = { workspace = true }
pinai-db = { workspace = true }
