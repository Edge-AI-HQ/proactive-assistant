[project]
name = "agent-engine"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pinai-contracts",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langsmith>=0.3.0",
  "deepagents>=0.6.7,<0.7.0",
  "langchain-daytona>=0.0.5",
  "langgraph-checkpoint-postgres>=3.1.0,<4",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "pyjwt>=2.12.1",
  "cryptography>=48.0.0",
  "httpx[socks]>=0.28.1",
  "langchain-tavily>=0.2.13",
  "browserbase>=1.0.0,<2.0",
  "playwright>=1.49.0,<2.0",
  "opencc-python-reimplemented>=0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_engine"]

[tool.uv.sources]
pinai-contracts = { workspace = true }
