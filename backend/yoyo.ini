# yoyo-migrations config — pure SQL, forward-only.
#
# Database connection passed at CLI time (yoyo doesn't interpolate env vars
# in config). Use:
#
#   uv run yoyo apply --batch -d "$DATABASE_URL"
#
# or via the Makefile / docker-compose db-migrate service which inject the
# URL automatically.
#
# `db/migrations/` files apply lexicographically by filename (NNN_xxx.sql).

[DEFAULT]
sources = db/migrations
batch_mode = on
verbosity = 1
# Custom log table name so it doesn't clash with apis migration log.
migration_table = pai_yoyo_migration_log
