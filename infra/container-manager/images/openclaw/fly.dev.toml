# OpenClaw 镜像构建配置 - Dev
# 从仓库根目录执行：
#   flyctl deploy -c infra/container-manager/images/openclaw/fly.dev.toml --build-only
# 构建完成后更新 secret：
#   flyctl secrets set OPENCLAW_IMAGE="registry.fly.io/pinclaw-assistant-dev@sha256:<digest>" -a pinclaw-api-dev

app = 'pinclaw-assistant-dev'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
