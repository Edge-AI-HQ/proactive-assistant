# OpenClaw 镜像构建配置 - Prod
# 生产环境禁止在终端直接 flyctl 变更；请走评审 + CI/CD 发布流程。
# 本文件仅供 CI 构建 prod assistant 镜像使用。
# OPENCLAW_IMAGE 应通过 CI/CD 写入 pinclaw-api-prod，格式：
#   registry.fly.io/pinclaw-assistant-prod@sha256:<digest>

app = 'pinclaw-assistant-prod'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
