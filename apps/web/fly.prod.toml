# apps/web（zebra 桌面 web 端）on Fly.io — prod 环境。
#
# Static SPA served by nginx（见 Dockerfile）。Build-time VITE_* 经
# deploy-prod.yml（_deploy.yml 的 deploy-web job）`--build-arg` 注入，取自
# backend/.env.production。随 prod 版本 release（v* tag）一起部署。
#
# Sibling tomls: fly.toml (dev)。

app = "proactive-ai-web-prod"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# Runtime nginx config — envsubst'd by nginx:alpine's template mechanism。
# same-origin /api 反代 prod api app（机制同 frontend fly.prod.toml）。
[env]
  NGINX_RESOLVER = "[fdaa::3]"
  NGINX_UPSTREAM_URL = "https://proactive-ai-api-prod.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
