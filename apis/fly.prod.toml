# Fly.io configuration for PIN AI Backend API (prod)
app = 'pinclaw-api-prod'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  CONTAINER_RUNTIME = 'fly'
  LITELLM_BASE_URL = 'https://pinclaw-litellm-prod.fly.dev'
  LITELLM_CONTAINER_BASE_URL = 'https://pinclaw-litellm-prod.fly.dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 400
    soft_limit = 250

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[deploy]
  strategy = 'rolling'
