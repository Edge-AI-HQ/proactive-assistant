<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Support</title>
    <style>
      :root {
        --bg: linear-gradient(180deg, rgba(255, 255, 255, 0.92) 0%, rgba(248, 238, 250, 0.92) 18%, rgba(244, 229, 246, 0.88) 34%, rgba(239, 225, 243, 0.84) 53%, rgba(223, 231, 248, 0.88) 77%, rgba(244, 245, 255, 0.96) 100%);
        --ink: #1a1630;
        --muted: #655f7f;
        --line: rgba(131, 102, 164, 0.16);
        --accent: #df5bb9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0) 42%),
          radial-gradient(circle at 18% 18%, rgba(230, 164, 226, 0.22), rgba(230, 164, 226, 0) 30%),
          radial-gradient(circle at 78% 22%, rgba(125, 168, 250, 0.22), rgba(125, 168, 250, 0) 28%),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        width: min(100%, 460px);
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 32px 24px 24px;
        box-shadow: 0 18px 45px rgba(78, 48, 109, 0.14);
        text-align: center;
      }
      .icon {
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font-size: 30px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(252, 236, 246, 0.82));
        border: 1px solid rgba(223, 91, 185, 0.18);
        box-shadow: 0 12px 30px rgba(193, 94, 162, 0.18);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.6;
      }
      .actions {
        display: grid;
        gap: 12px;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 15px 18px;
        border-radius: 16px;
        text-decoration: none;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        border: 0;
        cursor: pointer;
      }
      .btn-primary {
        color: #fff;
        background: linear-gradient(135deg, var(--accent), #eb76c7);
        box-shadow: 0 12px 28px rgba(223, 91, 185, 0.26);
      }
      .btn-secondary {
        color: #58467f;
        background: rgba(255, 255, 255, 0.74);
        border: 1px solid rgba(131, 102, 164, 0.14);
      }
      .hint {
        margin-top: 14px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✉</div>
      <h1>Opening your email app...</h1>
      <p>If nothing happens, use the button below or email us at <strong>support@pinai.io</strong>.</p>
      <div class="actions">
        <a class="btn btn-primary" href="mailto:support@pinai.io">Open Email App</a>
        <button class="btn btn-secondary" type="button" id="copy-email">Copy Email Address</button>
      </div>
      <p class="hint" id="hint">Trying to open your default mail app now.</p>
    </div>

    <script>
      const mailto = "mailto:support@pinai.io";
      const copyButton = document.getElementById("copy-email");
      const hint = document.getElementById("hint");

      window.setTimeout(() => {
        window.location.replace(mailto);
      }, 50);

      copyButton?.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText("support@pinai.io");
          if (hint) hint.textContent = "Email address copied.";
        } catch {
          if (hint) hint.textContent = "Copy failed. Please copy support@pinai.io manually.";
        }
      });
    </script>
  </body>
</html>
