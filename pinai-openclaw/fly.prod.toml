# Fly.io configuration for PIN AI OpenClaw Image Builder (prod)
# 此配置仅用于构建和推送 OpenClaw 镜像到 registry.fly.io
# 实际 OpenClaw 容器由 pinclaw-assistant-prod 动态创建，而非独立部署此 app

app = 'pinclaw-assistant-prod'
primary_region = 'iad'

[build]
  dockerfile = 'image/Dockerfile'
  build-target = ''

# 镜像构建完成后不自动部署
# 使用 flyctl deploy --build-only 仅构建镜像
# 然后在 pinclaw-api-prod secrets 中设置 OPENCLAW_IMAGE=registry.fly.io/pinclaw-openclaw-prod@sha256:<digest>

[env]
  # Build-time environment variables (if needed)
  OPENCLAW_VERSION = '2026.3.8'
