app = 'proactive-ai-api-dev'
primary_region = 'iad'

[build]
  dockerfile = 'apis/Dockerfile'
  [build.args]
    DEPLOY_ENV = 'dev'
    VITE_SUPABASE_URL = 'https://qgqjgrmpphyojzldatyb.supabase.co'
    VITE_SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_9gU1VUWGdEu9ZlPHWk6u0g_FeWnSXA7'
    VITE_API_BASE_URL = 'https://proactive-ai-api-dev.fly.dev'

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  CONTAINER_RUNTIME = 'fly'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 150
    soft_limit = 100

[deploy]
  strategy = 'rolling'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
