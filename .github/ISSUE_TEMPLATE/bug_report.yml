name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Web app
        - macOS app
        - iOS app
        - api
        - agent-engine
        - Connectors
        - Memory
        - Proactive cards
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.5 or a commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data, tokens or keys before pasting.
