name: PR Preview Cleanup

# PR 关闭(merge 或 close)时,销毁对应的临时 preview app,避免浪费。
# 配套 preview.yml(app 名 = pinai-pr-<PR号>)。

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy preview apps
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # 前端 + 后端副本（独立库是 -api 内的一台机器，随 -api 一起销毁，不单列）
          for app in \
            "pinai-pr-${{ github.event.pull_request.number }}" \
            "pinai-pr-${{ github.event.pull_request.number }}-api"; do
            flyctl apps destroy "$app" --yes 2>/dev/null \
              && echo "destroyed $app" \
              || echo "no preview app for $app (nothing to clean)"
          done
