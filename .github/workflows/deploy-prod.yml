name: Deploy Prod

# Prod env: manual dispatch only. Thin caller; all deploy logic lives in
# _deploy.yml.
#
# environment: production passes through to every job in _deploy.yml, so the
# GitHub Environment approval rules (reviewers / wait timer / branch policy)
# still gate the deploy — those live on the environment, not in this file.
#
# concurrency cancel-in-progress: false — never tear down a partial prod
# deploy mid-flight.
#
# run_filter is off — prod always deploys all components.

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: production
      env_file: .env.production
      dotenv_key_name: DOTENV_PRIVATE_KEY_PRODUCTION
      agents_app: proactive-ai-agents-prod
      litellm_app: proactive-ai-litellm-prod
      agents_toml: fly.prod.toml
      litellm_toml: fly.litellm-prod.toml
      frontend_toml: proactive-ai-frontend/fly.prod.toml
      daytona_version: production
      run_filter: false
