name: Deploy Prod

# Prod env: triggered by pushing a v* tag (the version source of truth), or
# by manual dispatch. Thin caller; all deploy logic lives in _deploy.yml.
#
# environment: production passes through to every job in _deploy.yml, so the
# GitHub Environment rules gate the deploy (currently the v* tag / branch
# policy; human-reviewer approval is intentionally not enabled yet) — those
# live on the environment, not in this file.
#
# concurrency cancel-in-progress: false — never tear down a partial prod
# deploy mid-flight.
#
# run_filter is off — prod always deploys all components.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: production
      env_file: .env.production
      dotenv_key_name: DOTENV_PRIVATE_KEY_PRODUCTION
      api_app: proactive-ai-api-prod
      engine_app: proactive-ai-engine-prod
      reward_app: proactive-ai-reward-prod
      api_toml: deploy/fly-split/fly.api.prod.toml
      engine_toml: deploy/fly-split/fly.engine.prod.toml
      reward_toml: deploy/fly-split/fly.reward.prod.toml
      litellm_app: proactive-ai-litellm-prod
      litellm_toml: fly.litellm-prod.toml
      web_toml: apps/web/fly.prod.toml
      daytona_version: production
      run_filter: false
