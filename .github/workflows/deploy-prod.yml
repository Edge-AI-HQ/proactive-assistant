name: Deploy Prod

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-openclaw:
    needs: release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    outputs:
      deploy-ref: ${{ steps.promote.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proactive-ai-v2
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Promote OPENCLAW_IMAGE from dev to prod
        id: promote
        run: |
          DEV_DIGEST=$(npx @dotenvx/dotenvx get OPENCLAW_IMAGE -f apis/.env.dev)
          PROD_DIGEST=$(npx @dotenvx/dotenvx get OPENCLAW_IMAGE -f apis/.env.production)

          if [ "$DEV_DIGEST" = "$PROD_DIGEST" ]; then
            echo "OPENCLAW_IMAGE already in sync, skipping"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "Promoting OPENCLAW_IMAGE: ${DEV_DIGEST}"
            npx @dotenvx/dotenvx set OPENCLAW_IMAGE "$DEV_DIGEST" -f apis/.env.production

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apis/.env.production
            git commit -m "chore: promote OPENCLAW_IMAGE to prod [skip ci]"
            git push
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

  deploy-apis:
    needs: [release, promote-openclaw]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote-openclaw.outputs.deploy-ref }}
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Extract VITE_* build args from encrypted env
        run: |
          VITE_SUPABASE_URL=$(npx @dotenvx/dotenvx get VITE_SUPABASE_URL -f apis/.env.production)
          VITE_SUPABASE_PUBLISHABLE_KEY=$(npx @dotenvx/dotenvx get VITE_SUPABASE_PUBLISHABLE_KEY -f apis/.env.production)
          VITE_API_BASE_URL=$(npx @dotenvx/dotenvx get VITE_API_BASE_URL -f apis/.env.production)
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> "$GITHUB_ENV"
        env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

      - name: Deploy APIs to prod
        run: |
          flyctl deploy --config fly.api-prod.toml --remote-only \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-litellm:
    needs: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy LiteLLM to prod
        working-directory: ops/litellm
        run: flyctl deploy --config fly.litellm-prod.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
