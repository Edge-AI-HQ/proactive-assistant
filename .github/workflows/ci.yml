name: CI

on:
  pull_request:
    branches: [proactive-ai-v3]

# dorny/paths-filter calls the GitHub REST API to list changed files on
# pull_request events, which needs pull-requests: read. The repo's default
# workflow token is read-only with no PR scope, so without this block the
# changes job 403s with "Resource not accessible by integration" and every
# downstream check is skipped via needs:. An explicit permissions block
# narrows everything unlisted to none, so contents: read (used by
# actions/checkout) must be listed alongside it.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            agents:
              - 'pinai-agents/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'proactive-ai-frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  pinai-agents-checks:
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install pinai-agents (with dev group)
        working-directory: pinai-agents
        run: uv sync

      - name: ruff check
        working-directory: pinai-agents
        run: uv run ruff check

      - name: ruff format check
        working-directory: pinai-agents
        run: uv run ruff format --check

      # continue-on-error: ~313 pre-existing mypy errors (single root cause —
      # cursors not declaring row_factory=dict_row, so dict rows read as
      # tuples). Reported but non-blocking until the cleanup PR lands; drop
      # this line afterwards so mypy becomes a hard gate.
      - name: mypy
        working-directory: pinai-agents
        run: uv run mypy src
        continue-on-error: true

      - name: pytest
        working-directory: pinai-agents
        # DB-backed tests self-skip when TEST_DATABASE_URL is unset
        # (tests/conftest.py pytest_collection_modifyitems). Dummy values
        # satisfy import-time client construction (e.g. tavily.py) without
        # reaching any external service.
        env:
          TAVILY_API_KEY: dummy
          BROWSERBASE_API_KEY: dummy
          BROWSERBASE_PROJECT_ID: dummy
          COMPOSIO_API_KEY: dummy
          OPENAI_API_KEY: dummy
          LITELLM_MASTER_KEY: dummy
          PAI_JWT_SIGNING_KEY: dummy
          SUPABASE_SECRET_KEY: dummy
        run: uv run pytest -q

      - name: trust boundary check
        working-directory: pinai-agents
        run: bash scripts/check_trust_boundary.sh

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check (Frontend)
        run: npm run type-check --workspace=@pin-ai/proactive-ai-frontend

      - name: Unit tests (Frontend)
        run: npm test --workspace=@pin-ai/proactive-ai-frontend

      - name: iOS signing check (canonical DEVELOPMENT_TEAM)
        run: bash proactive-ai-frontend/scripts/check-ios-signing.sh
