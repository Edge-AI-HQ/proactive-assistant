name: CI

on:
  pull_request:
    branches: [main]

# dorny/paths-filter calls the GitHub REST API to list changed files on
# pull_request events, which needs pull-requests: read. The repo's default
# workflow token is read-only with no PR scope, so without this block the
# changes job 403s with "Resource not accessible by integration" and every
# downstream check is skipped via needs:. An explicit permissions block
# narrows everything unlisted to none, so contents: read (used by
# actions/checkout) must be listed alongside it.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            agents:
              - 'pinai-agents/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'proactive-ai-frontend/**'
              - 'packages/**'
              - 'apps/**'
              - 'eslint.config.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  pinai-agents-checks:
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    # Ephemeral Postgres so the 230+ DB-backed tests actually run in CI.
    # MUST be pgvector/* — the schema uses the vector extension; vanilla
    # postgres fails the migration. Fresh per run, never touches real DBs.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Picked up by tests/conftest.py; activates the DB-backed suite.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install pinai-agents (with dev group)
        working-directory: pinai-agents
        run: uv sync

      - name: ruff check
        working-directory: pinai-agents
        run: uv run ruff check

      - name: ruff format check
        working-directory: pinai-agents
        run: uv run ruff format --check

      - name: mypy
        working-directory: pinai-agents
        run: uv run mypy src

      - name: Apply migrations (pai_* schema + RLS policies + roles)
        working-directory: pinai-agents
        run: uv run yoyo apply --batch -d "postgresql+psycopg://postgres:postgres@localhost:5432/postgres"

      - name: Seed patterns (pattern route/matcher tests assume 111 patterns seeded)
        working-directory: pinai-agents
        run: uv run python -m scripts.seed_patterns --dsn "postgresql://postgres:postgres@localhost:5432/postgres"

      - name: pytest
        working-directory: pinai-agents
        # DB-backed tests run against the postgres service above
        # (TEST_DATABASE_URL is set at job level). Dummy values satisfy
        # import-time client construction (e.g. tavily.py) without reaching
        # any external service.
        env:
          TAVILY_API_KEY: dummy
          BROWSERBASE_API_KEY: dummy
          BROWSERBASE_PROJECT_ID: dummy
          COMPOSIO_API_KEY: dummy
          OPENAI_API_KEY: dummy
          LITELLM_MASTER_KEY: dummy
          PAI_JWT_SIGNING_KEY: dummy
          SUPABASE_SECRET_KEY: dummy
        run: uv run pytest -q

      - name: trust boundary check
        working-directory: pinai-agents
        run: bash scripts/check_trust_boundary.sh

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          # 22 (= local dev + build-ios.yml): @supabase/realtime-js treats
          # Node <22 as "no native WebSocket" unconditionally, so importing
          # src/lib/supabase.ts under vitest on Node 20 raises an async
          # rejection that lands at a random point in teardown — a flaky red.
          node-version: 22
          cache: npm

      - run: npm ci

      # 共用层（packages/*）：边界 lint（前端版 trust boundary，规则见
      # 根 eslint.config.mjs）+ type-check + 单测。
      - name: Boundary lint (packages)
        run: npm run lint:packages

      - name: Type check (packages)
        run: npm run type-check --workspace=@pin-ai/core --workspace=@pin-ai/state

      - name: Unit tests (packages)
        run: npm test --workspace=@pin-ai/core --workspace=@pin-ai/state

      - name: Type check (Frontend)
        run: npm run type-check --workspace=@pin-ai/proactive-ai-frontend

      - name: Unit tests (Frontend)
        run: npm test --workspace=@pin-ai/proactive-ai-frontend

      - name: Type check (Desktop shell)
        run: npm run type-check --workspace=@pin-ai/desktop

      - name: iOS signing check (canonical DEVELOPMENT_TEAM)
        run: bash proactive-ai-frontend/scripts/check-ios-signing.sh

      # 生产镜像构建验证——流程缺口（PR #101）：Dockerfile 的 COPY 清单
      # （packages/ 等）漏更新只有 docker build 能暴露，tsc/vitest 全绿
      # 拦不住（当时 make reset 与 Deploy Dev 双双失败）。只 build 不 push。
      # WORKDIR 必须与 docker-compose.yml 的 build args 一致。
      - name: Docker build (frontend image)
        run: docker build --build-arg WORKDIR=proactive-ai-frontend -f proactive-ai-frontend/Dockerfile .
