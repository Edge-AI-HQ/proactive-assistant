name: PR Preview

# 按需起一个临时环境预览某个 PR，**按实际改动范围智能决定起哪些副本**（最省）：
#   - 只改前端           → 只起 pinai-pr-<N>（前端），指向共享 dev 后端
#   - 改了后端逻辑        → 额外起 pinai-pr-<N>-api（后端副本），前端指向它；后端共用 dev 库
#   - 还动了 DB migration → 再起 pinai-pr-<N>-db（独立 Postgres），后端连它跑迁移，dev 库零影响
# 没改到的服务一律不起。auth 一律复用共享 dev Supabase（登录不随 PR 变）。
#
# 销毁：PR 关闭→preview-cleanup.yml；不关 PR 随时拆→preview-down.yml；两者都按 pinai-pr-<N>* 全清。
#
# ⚠️ 成本：后端副本是 web+chat 两进程（~4 vCPU+4GB，不缩零）+ 可选 Postgres，跑着就花钱，及时拆。
# Discovery note: workflow_dispatch 要能触发，本文件必须在默认分支（main）上。

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (→ 按改动范围起 pinai-pr-<N>[-api][-db] + 回贴该 PR)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  FLY_ORG: pin-ai
  REGION: ord
  DEV_API_URL: https://proactive-ai-agents-dev.fly.dev

jobs:
  # ── 1. 判断这个 PR 改了哪些范围 ─────────────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      migration: ${{ steps.scope.outputs.migration }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changed paths
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh pr diff "${{ inputs.pr }}" --repo "${{ github.repository }}" --name-only)
          echo "$files"
          # 路径 → 服务映射（packages/ 是前端共享层，算前端）
          grep -qE '^(packages|apps/web)/' <<<"$files" && fe=true || fe=false
          grep -qE '^backend/' <<<"$files" && be=true || be=false
          grep -qE '^backend/db/migrations/' <<<"$files" && mig=true || mig=false
          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "backend=$be" >> "$GITHUB_OUTPUT"
          echo "migration=$mig" >> "$GITHUB_OUTPUT"
          echo "→ frontend=$fe backend=$be migration=$mig"

  # ── 2. 后端副本（仅当后端改了）。动了 migration 则先起独立库 ────────────
  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.urls.outputs.api_url }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ inputs.pr }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute names/URLs
        id: urls
        run: |
          api="pinai-pr-${{ inputs.pr }}-api"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "api_url=https://$api.fly.dev" >> "$GITHUB_OUTPUT"

      - name: Create backend app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl apps create "${{ steps.urls.outputs.api }}" --org "$FLY_ORG" 2>/dev/null || true

      # A 档：独立库不再是单独的 Fly app，而是后端 app **内的一台 postgres 机器**（6PN 内网）。
      # 这样后端 app = web + chat + db 一锅：一次 destroy、一套 secret，不再散成 -db。
      # 没动 migration → 不起这台，DATABASE_URL 用 dev 的（release_command 的 yoyo apply 幂等空跑）。
      - name: Run isolated DB machine inside backend app (only if migration changed)
        id: db
        if: needs.detect.outputs.migration == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          api="${{ steps.urls.outputs.api }}"
          # db 机器跟后端 web/chat 同区（fly.dev.toml 的 primary_region），避免跨区查询延迟
          reg=$(sed -n "s/^primary_region *= *'\([^']*\)'.*/\1/p" backend/fly.dev.toml | head -1)
          reg="${reg:-$REGION}"
          echo "db region: $reg"
          # 同款 pgvector（迁移需要 vector 扩展）。throwaway、无卷（preview 不需持久化）。
          flyctl machine run pgvector/pgvector:pg15 \
            --app "$api" --region "$reg" --name db --vm-memory 1024 \
            --env POSTGRES_USER=postgres --env POSTGRES_PASSWORD=preview --env POSTGRES_DB=postgres
          # 取这台 db 机器的 6PN 私有 IPv6（machine 之间走内网）
          ip=""
          for i in $(seq 1 12); do
            ip=$(flyctl machine list --app "$api" --json 2>/dev/null \
              | python3 -c "import sys,json; print(next((m['private_ip'] for m in json.load(sys.stdin) if m.get('name')=='db'),''))")
            [ -n "$ip" ] && break || sleep 3
          done
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "db machine 6PN ip: $ip"
          sleep 15  # 等 postgres initdb 起来

      - name: Inject all dev secrets (+ 独立库时覆盖 DATABASE_URL)
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}
        run: |
          api="${{ steps.urls.outputs.api }}"
          # 整套 dev secret（含 Composio/Stripe/LiteLLM 等副作用服务——前期全保留，验证完整环境）
          # 用默认 stage（不要 --no-stage）：app 内已有 pg 机器时，立即应用会因「无 release 镜像」失败；
          # 暂存即可，随后面的 flyctl deploy 一起生效。
          python3 scripts/sync_fly_secrets.py --app "$api" --env-file .env.dev
          if [ "${{ needs.detect.outputs.migration }}" = "true" ]; then
            ip="${{ steps.db.outputs.ip }}"
            # 覆盖 DATABASE_URL 指向 app 内的 db 机器（dev 库零影响）；deploy 时随 release_command 生效
            flyctl secrets set "DATABASE_URL=postgresql://postgres:preview@[$ip]:5432/postgres" --app "$api" --stage
          else
            echo "（共用 dev 库：DATABASE_URL 用 .env.dev 的值，release_command 的 yoyo apply 幂等空跑）"
          fi

      - name: Generate per-PR fly config
        run: |
          api="${{ steps.urls.outputs.api }}"
          # 从 dev toml 派生：换 app 名 + 把自指的内部/回连 URL 改成本副本
          sed \
            -e "s/^app = .*/app = '$api'/" \
            -e "s#proactive-ai-agents-dev#$api#g" \
            backend/fly.dev.toml > backend/fly.pr.toml
          echo "----- fly.pr.toml [app/env] -----"; grep -E "^app|PAI_API_URL|WEB_INTERNAL_URL|CHAT_INTERNAL_URL" backend/fly.pr.toml || true

      - name: Deploy backend preview (web + chat)
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # --ha=false：preview 每个进程组只起 1 台（web×1 + chat×1），省一半算力
          flyctl deploy --config fly.pr.toml --remote-only --ha=false --app "${{ steps.urls.outputs.api }}"

  # ── 3. 前端副本（前端改了，或后端改了也要个前端去打它）─────────────────
  # 与 backend 并行：后端副本 URL 是确定的（pinai-pr-<N>-api.fly.dev），前端只需这个字符串，
  # 不必等后端部署完 → 省掉串行等待（实测 ~90s）。后端真失败的话前端这条 API 会指向空地址，
  # comment/run 状态会显示后端失败，可接受。
  frontend:
    needs: [detect]
    if: needs.detect.outputs.frontend == 'true' || needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr checkout ${{ inputs.pr }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide which backend the frontend points at
        id: api
        run: |
          # 后端改了 → 指向确定的后端副本 URL；否则指向共享 dev 后端
          if [ "${{ needs.detect.outputs.backend }}" = "true" ]; then
            echo "url=https://pinai-pr-${{ inputs.pr }}-api.fly.dev" >> "$GITHUB_OUTPUT"
          else
            echo "url=$DEV_API_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Decrypt VITE_* build args
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}
        run: |
          json=$(npx --yes @dotenvx/dotenvx get -f backend/.env.dev --format json)
          python3 - "$json" <<'PY' >> "$GITHUB_ENV"
          import json, sys
          d = json.loads(sys.argv[1])
          for k in ("VITE_SUPABASE_URL", "VITE_SUPABASE_PUBLISHABLE_KEY"):
              print(f"{k}={d[k]}")
          PY

      # 2026-07-09 起前端预览 = apps/web(zebra)。它是 same-origin SPA:API 地址
      # 不烘进包,靠 nginx 运行时 env NGINX_UPSTREAM_URL 反代(同 deploy-web 机制),
      # 所以 per-PR 后端 URL 用 --env 注入而非 build-arg。
      - name: Create + deploy frontend preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app="pinai-pr-${{ inputs.pr }}"
          flyctl apps create "$app" --org "$FLY_ORG" 2>/dev/null || true
          flyctl deploy . \
            --config apps/web/fly.toml \
            --dockerfile apps/web/Dockerfile \
            --remote-only --ha=false --app "$app" \
            --build-arg WORKDIR=apps/web \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY" \
            --env NGINX_UPSTREAM_URL="${{ steps.api.outputs.url }}"

  # ── 4. 回贴 PR：列出这次起了哪些副本 + 各自 URL ──────────────────────────
  comment:
    needs: [detect, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URLs on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fe="https://pinai-pr-${{ inputs.pr }}.fly.dev/"
          api="https://pinai-pr-${{ inputs.pr }}-api.fly.dev/"
          body="🔗 **PR Preview**（按需起，关 PR 或说「拆 preview」自动销毁）"
          if [ "${{ needs.detect.outputs.frontend }}" = "true" ] || [ "${{ needs.detect.outputs.backend }}" = "true" ]; then
            body="$body
          - 前端: $fe"
          fi
          if [ "${{ needs.detect.outputs.backend }}" = "true" ]; then
            db_note=""
            [ "${{ needs.detect.outputs.migration }}" = "true" ] && db_note="（独立库，dev 不受影响）" || db_note="（共用 dev 库）"
            body="$body
          - 后端: $api $db_note"
          fi
          body="$body

          范围判定: frontend=${{ needs.detect.outputs.frontend }} backend=${{ needs.detect.outputs.backend }} migration=${{ needs.detect.outputs.migration }}"
          gh pr comment "${{ inputs.pr }}" --repo "${{ github.repository }}" --body "$body"
