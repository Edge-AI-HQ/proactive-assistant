name: Internal Reward Dashboard Dev

# Standalone CI/CD for the internal reward dashboard frontend.
#
# This is intentionally separate from ci.yml and deploy-dev.yml. It watches
# internal-reward-dashboard/**, verifies the app, and deploys the Fly dev app
# on push to main:
# https://proactive-ai-reward-dashboard-dev.fly.dev

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'internal-reward-dashboard/**'
      - '.github/workflows/internal-reward-dashboard-dev.yml'
  push:
    branches: [main]
    paths:
      - 'internal-reward-dashboard/**'
      - '.github/workflows/internal-reward-dashboard-dev.yml'

concurrency:
  group: internal-reward-dashboard-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Private repo only: public-mirror.yml copies this file to the public mirror.
    if: github.repository == 'Edge-AI-HQ/PIN-AI-ASSISTANT'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: internal-reward-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: internal-reward-dashboard
        run: npm ci

      - name: Type check
        working-directory: internal-reward-dashboard
        run: npm run type-check

      - name: Unit tests
        working-directory: internal-reward-dashboard
        run: npm test

      - name: Build
        working-directory: internal-reward-dashboard
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Extract dev VITE_* build args from encrypted env
        run: |
          VITE_SUPABASE_URL=$(npx @dotenvx/dotenvx get VITE_SUPABASE_URL -f backend/.env.dev)
          VITE_SUPABASE_PUBLISHABLE_KEY=$(npx @dotenvx/dotenvx get VITE_SUPABASE_PUBLISHABLE_KEY -f backend/.env.dev)
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}

      - name: Deploy internal reward dashboard to Fly dev
        working-directory: internal-reward-dashboard
        run: |
          flyctl deploy --config fly.toml --remote-only \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
