# RN iOS 构建链(Capacitor build-ios.yml 的接替者,2026-07-07 起接管 dev 自动构建)。
# 不引 EAS(避免新账号/计费依赖),复用现有签名 secrets 体系:
#   dev  = bundle ai.pin.proactive.development + PROVISIONING_PROFILE_DEV_BASE64(push main 自动 → TestFlight)
#   prod = bundle ai.pin.proactive            + PROVISIONING_PROFILE_BASE64(仅手动 dispatch → TestFlight)
# 变体身份(bundle id / scheme / 显示名 / 构建号)由 apps/mobile/app.config.js 按
# APP_VARIANT / APP_BUILD_NUMBER 注入,与 Capacitor build-ios.sh 的 per-env 约定同构。
#
# 门禁卡缺口(2026-07-07):现有两张 distribution profile 是给 Capacitor app 生成的,
# 不含 RN 新增的 focus-status / healthkit.background-delivery 两个 entitlement——
# "Trim entitlements" step 在 prebuild 后剥掉它们(能力与线上 Capacitor 版持平,零倒退)。
# 团队在 Apple 后台补开能力 + 重新生成 dev/prod profile + 更新 secrets 后,删掉该 step 即恢复。
name: Build RN iOS

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      # 共享逻辑/UI 层(@pin-ai/core·state·ui-kit·design)变化也要重建 RN app
      - "packages/**"
      - ".github/workflows/build-rn-ios.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

# Newer push cancels an in-flight dev build so TestFlight isn't flooded.
concurrency:
  group: build-rn-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26:唯一带 Xcode 26.6 的镜像(见下 Select Xcode)
    runs-on: macos-26
    # RN 0.85 必须从源码编译(见下 RCT_USE_PREBUILT_RNCORE),冷启 archive 明显慢于 Capacitor
    timeout-minutes: 90
    env:
      # CocoaPods 要求 UTF-8 locale;RN 0.85 的 prebuilt RNCore 产物损坏,必须
      # 源码编译(与本地 build-rn-device.sh 同一组修法,踩坑记录见 A-RN-frontend skill)
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      RCT_USE_PREBUILT_RNCORE: "0"
      RCT_USE_RN_DEP: "0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Apple requires iOS 26 SDK (Xcode 26) for App Store submissions from 2026-04-28.
      # 必须 26.6(= 本地验证过的版本):expo-modules-jsi(SDK 56)的 Swift 源用了
      # `weak let`,26.0.1 的 Swift 编译不过("'weak' must be a mutable variable")。
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      # push → dev (auto); workflow_dispatch → the chosen input.
      # 构建号 = 1000 + run#:高于 Capacitor 轨道(200 + run#,现约 330+),同一
      # TestFlight app 记录、同一 1.0 版本线下 RN 构建恒排最新。
      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then TARGET=dev; else TARGET="${{ inputs.environment }}"; fi
          echo "env=$TARGET" >> "$GITHUB_OUTPUT"
          echo "build_number=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = "dev" ]; then
            echo "variant=ci-dev" >> "$GITHUB_OUTPUT"
            echo "bundle_id=ai.pin.proactive.development" >> "$GITHUB_OUTPUT"
            echo "env_file=backend/.env.dev" >> "$GITHUB_OUTPUT"
          else
            echo "variant=prod" >> "$GITHUB_OUTPUT"
            echo "bundle_id=ai.pin.proactive" >> "$GITHUB_OUTPUT"
            echo "env_file=backend/.env.production" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      # dotenvx 解密对应环境的 VITE_* → EXPO_PUBLIC_*(Release archive 的
      # "Bundle React Native code and images" 阶段 inline 进 JS bundle,
      # 与本地 build-rn-device.sh 的 Release 路径同模式)。
      - name: Resolve app env (EXPO_PUBLIC_*)
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          ENV_FILE: ${{ steps.target.outputs.env_file }}
        run: |
          get() { npx -y @dotenvx/dotenvx get "$1" -f "$ENV_FILE" 2>/dev/null; }
          API_URL="$(get VITE_PIN_API_URL)"
          SB_URL="$(get VITE_SUPABASE_URL)"
          SB_KEY="$(get VITE_SUPABASE_PUBLISHABLE_KEY)"
          for pair in "VITE_PIN_API_URL=$API_URL" "VITE_SUPABASE_URL=$SB_URL" "VITE_SUPABASE_PUBLISHABLE_KEY=$SB_KEY"; do
            [ -n "${pair#*=}" ] || { echo "Empty ${pair%%=*} from $ENV_FILE" >&2; exit 1; }
          done
          {
            echo "EXPO_PUBLIC_PIN_API_URL=$API_URL"
            echo "EXPO_PUBLIC_SUPABASE_URL=$SB_URL"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SB_KEY"
          } >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_PIN_API_URL=$API_URL"

      # CNG:从 app.config.js 生成 ios/(原生工程不入库)。
      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          APP_VARIANT: ${{ steps.target.outputs.variant }}
          APP_BUILD_NUMBER: ${{ steps.target.outputs.build_number }}
        run: npx expo prebuild --platform ios --no-install

      # 门禁卡缺口的临时修法(文件头有全文说明):剥掉现有 profile 不含的两个
      # entitlement;aps-environment 对齐 App Store 分发要求的 production
      # (expo-notifications 生成的默认值是 development,manual signing 下不匹配即拒签)。
      - name: Trim entitlements to current provisioning profiles
        working-directory: apps/mobile
        run: |
          ENT="ios/PINAIDev/PINAIDev.entitlements"
          echo "--- generated entitlements ---"
          /usr/libexec/PlistBuddy -c "Print" "$ENT"
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.focus-status" "$ENT" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.healthkit.background-delivery" "$ENT" 2>/dev/null || true
          if /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ENT" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENT"
          else
            /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENT"
          fi
          echo "--- after trim ---"
          /usr/libexec/PlistBuddy -c "Print" "$ENT"

      - name: Pod install
        working-directory: apps/mobile/ios
        run: pod install

      # Import Apple Distribution certificate into a temporary keychain
      # (same steps as the proven build-ios.yml).
      - name: Install Apple certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # Each bundle id has its own distribution profile: prod = ai.pin.proactive,
      # dev = ai.pin.proactive.development. Pick the matching secret by target env.
      - name: Install provisioning profile
        id: provisioning
        env:
          PROFILE_PROD: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROFILE_DEV: ${{ secrets.PROVISIONING_PROFILE_DEV_BASE64 }}
          TARGET_ENV: ${{ steps.target.outputs.env }}
        run: |
          if [ "$TARGET_ENV" = "dev" ]; then PROFILE_BASE64="$PROFILE_DEV"; else PROFILE_BASE64="$PROFILE_PROD"; fi
          if [ -z "$PROFILE_BASE64" ]; then
            echo "Missing provisioning profile secret for env=$TARGET_ENV" >&2; exit 1
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/pinai-rn.mobileprovision
          # Extract profile name for PROVISIONING_PROFILE_SPECIFIER
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/pinai-rn.mobileprovision)")"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Using profile: $PROFILE_NAME"

      - name: Archive
        working-directory: apps/mobile/ios
        env:
          PROFILE_NAME: ${{ steps.provisioning.outputs.profile_name }}
        run: |
          xcodebuild archive \
            -workspace PINAIDev.xcworkspace \
            -scheme PINAIDev \
            -configuration Release \
            -archivePath build/PINAIDev.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=7T7C9L7H8F \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"

      - name: Export IPA
        working-directory: apps/mobile/ios
        env:
          PROFILE_NAME: ${{ steps.provisioning.outputs.profile_name }}
          BUNDLE_ID: ${{ steps.target.outputs.bundle_id }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>7T7C9L7H8F</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/PINAIDev.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f build/export/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -rf "$RUNNER_TEMP/private_keys" ~/.appstoreconnect/private_keys
