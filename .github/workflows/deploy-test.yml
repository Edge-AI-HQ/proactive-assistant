name: Deploy Test

# Test env: manual dispatch only — used to run a full deploy on Fly before
# merging. Thin caller; all deploy logic lives in _deploy.yml.
#
# Discovery note: this file MUST exist on the default branch
# (main) for the "Run workflow" button to appear; once the
# dropdown is up, GitHub uses the YAML + code from the branch you pick.
#
# run_filter is off — test always deploys all components (no path filter).

on:
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    # Private repo only: public-mirror.yml copies this file to the public mirror.
    if: github.repository == 'Edge-AI-HQ/PIN-AI-ASSISTANT'
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      env_file: .env.test
      dotenv_key_name: DOTENV_PRIVATE_KEY_TEST
      api_app: proactive-ai-api-test
      engine_app: proactive-ai-engine-test
      reward_app: proactive-ai-reward-test
      api_toml: deploy/fly-split/fly.api.test.toml
      engine_toml: deploy/fly-split/fly.engine.test.toml
      reward_toml: deploy/fly-split/fly.reward.test.toml
      litellm_app: proactive-ai-litellm-test
      litellm_toml: fly.litellm-test.toml
      daytona_version: test
      run_filter: false
