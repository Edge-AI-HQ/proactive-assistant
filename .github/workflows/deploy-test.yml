name: Deploy Test

# Test env: deploy any branch via Actions UI dispatch.
#
# How discovery works: this workflow file MUST exist on the default
# branch (proactive-ai-v3) for the "Run workflow" button to appear.
# Once the dropdown is up, GitHub uses the YAML and code from the
# branch you select.
#
# Scope (this version): pinai-agents + LiteLLM + frontend. apis is
# intentionally not deployed — test exercises the
# frontend → pinai-agents → LiteLLM path only.
#
# Daytona snapshot is rebuilt on every run before deploy-agents so
# sandbox.py forks from it (~5-10s) instead of declarative image
# building (~30-50s) on the first chat message.
#
# Secret injection model:
#   * pinai-agents — scripts/sync_fly_secrets.py pipes the decrypted
#     .env.test into `flyctl secrets import` as a single app-level set.
#     Per-process-group secrets are NOT supported by flyctl (verified
#     0.4.48), so chat sees the same env as web until web/chat split
#     into separate fly apps; see chat/asgi.py docstring and
#     scripts/sync_fly_secrets.py docstring for the trust-boundary
#     degraded state.
#   * LiteLLM — Docker CMD wraps `dotenvx run`. Needs
#     DOTENV_PRIVATE_KEY_TEST set as a fly secret so the container
#     can decrypt .env.test at startup.
#   * frontend — VITE_* baked at build time via --build-arg.

on:
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  # Bake/refresh the Daytona sandbox snapshot before pinai-agents deploys.
  # sandbox.py's PINAI_DAYTONA_SNAPSHOT path forks from this snapshot in
  # ~5-10s instead of the ~30-50s declarative image build. Tag is fixed
  # ("pinai-sandbox:test"), --recreate forces a fresh build each run so
  # the snapshot tracks the current pinai_sdk source — no version bump
  # ritual needed.
  build-daytona-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8

      - name: Decrypt DAYTONA_API_KEY from .env.test
        working-directory: pinai-agents
        env:
          DOTENV_PRIVATE_KEY_TEST: ${{ secrets.DOTENV_PRIVATE_KEY_TEST }}
        run: |
          DAYTONA_API_KEY=$(npx @dotenvx/dotenvx get DAYTONA_API_KEY -f .env.test)
          # Mask before exporting so it never appears in subsequent step logs.
          echo "::add-mask::$DAYTONA_API_KEY"
          echo "DAYTONA_API_KEY=$DAYTONA_API_KEY" >> "$GITHUB_ENV"

      - name: Build/refresh Daytona snapshot (pinai-sandbox:test)
        working-directory: pinai-agents
        run: |
          uv sync --no-dev
          uv run python infra/daytona/build_snapshot.py --version test --recreate

  deploy-agents:
    runs-on: ubuntu-latest
    needs: build-daytona-snapshot
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Sync fly secrets from .env.test
        working-directory: pinai-agents
        env:
          DOTENV_PRIVATE_KEY_TEST: ${{ secrets.DOTENV_PRIVATE_KEY_TEST }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 scripts/sync_fly_secrets.py \
            --app proactive-ai-agents-test \
            --env-file .env.test

      - name: Deploy pinai-agents to test
        working-directory: pinai-agents
        run: flyctl deploy --config fly.test.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-litellm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Stage DOTENV_PRIVATE_KEY_TEST as fly secret
        run: |
          flyctl secrets set --app proactive-ai-litellm-test --stage \
            "DOTENV_PRIVATE_KEY_TEST=${DOTENV_PRIVATE_KEY_TEST}"
        env:
          DOTENV_PRIVATE_KEY_TEST: ${{ secrets.DOTENV_PRIVATE_KEY_TEST }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy LiteLLM to test
        working-directory: ops/litellm
        run: flyctl deploy --config fly.litellm-test.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Extract VITE_* build args from encrypted env
        run: |
          VITE_PIN_API_URL=$(npx @dotenvx/dotenvx get VITE_PIN_API_URL -f pinai-agents/.env.test)
          VITE_SUPABASE_URL=$(npx @dotenvx/dotenvx get VITE_SUPABASE_URL -f pinai-agents/.env.test)
          VITE_SUPABASE_PUBLISHABLE_KEY=$(npx @dotenvx/dotenvx get VITE_SUPABASE_PUBLISHABLE_KEY -f pinai-agents/.env.test)
          echo "VITE_PIN_API_URL=$VITE_PIN_API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
        env:
          DOTENV_PRIVATE_KEY_TEST: ${{ secrets.DOTENV_PRIVATE_KEY_TEST }}

      # Build context = repo root so `COPY capacitor-plugins/` in the
      # Dockerfile resolves the sibling workspace. See deploy-dev.yml for
      # the long comment.
      - name: Deploy frontend to test
        run: |
          flyctl deploy . \
            --config proactive-ai-frontend/fly.test.toml \
            --dockerfile proactive-ai-frontend/Dockerfile \
            --remote-only \
            --build-arg WORKDIR=proactive-ai-frontend \
            --build-arg VITE_PIN_API_URL="$VITE_PIN_API_URL" \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
