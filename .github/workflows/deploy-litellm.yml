name: Deploy LiteLLM (Dev)

on:
  push:
    branches: [proactive-ai-v2]
    paths:
      - 'ops/litellm/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy LiteLLM to dev
        working-directory: ops/litellm
        run: flyctl deploy --config fly.litellm-dev.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
