name: PR Preview Teardown (manual)

# 按需销毁某个 PR 的临时 preview app（对称于 preview.yml 的起）。
# 触发：手动 / dev-pipeline agent 在 Linear 里收到「拆/关 preview」时 `gh workflow run`。
# 销毁 pinai-pr-<N>（前端）+ pinai-pr-<N>-api（后端副本，full-stack preview 时才有）。
# 注：PR 关闭时的自动销毁在 preview-cleanup.yml；这个是不关 PR 也能随时拆的手动入口。
#
# Discovery note: workflow_dispatch 要能触发，本文件必须在默认分支（main）上。

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (→ 销毁 pinai-pr-<N> 及其 -api 副本)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Destroy preview apps
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for app in "pinai-pr-${{ inputs.pr }}" "pinai-pr-${{ inputs.pr }}-api"; do
            flyctl apps destroy "$app" --yes 2>/dev/null \
              && echo "destroyed $app" \
              || echo "no preview app for $app (nothing to clean)"
          done
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ inputs.pr }}" --repo "${{ github.repository }}" \
            --body "🧹 已拆除该 PR 的 preview 环境（前端 + 后端副本，如有）。需要时再说「部署」即可重起。"
