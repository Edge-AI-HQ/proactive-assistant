name: Deploy Dev

# Dev env: auto on push to proactive-ai-v3, also workflow_dispatch.
#
# Scope: pinai-agents + LiteLLM + frontend. Mirrors deploy-test.yml
# structure (web/chat in a single fly app via [processes], no apis/
# Node backend, no OpenClaw user containers).
#
# Path filter — only the apps whose source actually changed get
# redeployed. Note pinai-agents/.env.dev counts as a frontend trigger
# because the VITE_* build args live there.
#
# Secret injection model (same as deploy-test.yml):
#   * pinai-agents — scripts/sync_fly_secrets.py imports the decrypted
#     .env.dev as a single app-level set. Per-process-group secrets
#     aren't supported by flyctl (0.4.48), so the trust-boundary
#     runtime guard is intentionally degraded — see
#     scripts/sync_fly_secrets.py docstring and chat/asgi.py.
#   * LiteLLM — Docker CMD wraps `dotenvx run`. Needs
#     DOTENV_PRIVATE_KEY_DEV set as a fly secret so the container
#     can decrypt .env.dev at startup.
#   * frontend — VITE_* baked at build time via --build-arg.
#
# Daytona snapshot is rebuilt before deploy-agents so sandbox.py forks
# from a fresh image (~5-10s) instead of declarative build (~30-50s)
# on the first chat message. Tag fixed: pinai-sandbox:dev.

on:
  workflow_dispatch:
  push:
    branches: [proactive-ai-v3]
    paths:
      - 'pinai-agents/**'
      - 'ops/litellm/**'
      - 'proactive-ai-frontend/**'

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.filter.outputs.agents }}
      litellm: ${{ steps.filter.outputs.litellm }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agents:
              - 'pinai-agents/**'
            litellm:
              - 'ops/litellm/**'
            frontend:
              - 'proactive-ai-frontend/**'
              - 'pinai-agents/.env.dev'

  build-daytona-snapshot:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Decrypt DAYTONA_API_KEY from .env.dev
        working-directory: pinai-agents
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}
        run: |
          DAYTONA_API_KEY=$(npx @dotenvx/dotenvx get DAYTONA_API_KEY -f .env.dev)
          # Mask before exporting so it never appears in subsequent step logs.
          echo "::add-mask::$DAYTONA_API_KEY"
          echo "DAYTONA_API_KEY=$DAYTONA_API_KEY" >> "$GITHUB_ENV"

      - name: Build/refresh Daytona snapshot (pinai-sandbox:dev)
        working-directory: pinai-agents
        run: |
          uv sync --no-dev
          uv run python infra/daytona/build_snapshot.py --version dev --recreate

  deploy-agents:
    needs: [changes, build-daytona-snapshot]
    if: |
      always()
      && needs.changes.result == 'success'
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.agents == 'true')
      && needs.build-daytona-snapshot.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Sync fly secrets from .env.dev
        working-directory: pinai-agents
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          python3 scripts/sync_fly_secrets.py \
            --app proactive-ai-agents-dev \
            --env-file .env.dev

      - name: Deploy pinai-agents to dev
        working-directory: pinai-agents
        run: flyctl deploy --config fly.dev.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-litellm:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.litellm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Stage DOTENV_PRIVATE_KEY_DEV as fly secret
        run: |
          flyctl secrets set --app proactive-ai-litellm-dev --stage \
            "DOTENV_PRIVATE_KEY_DEV=${DOTENV_PRIVATE_KEY_DEV}"
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy LiteLLM to dev
        working-directory: ops/litellm
        run: flyctl deploy --config fly.litellm-dev.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Extract VITE_* build args from encrypted env
        run: |
          VITE_PIN_API_URL=$(npx @dotenvx/dotenvx get VITE_PIN_API_URL -f pinai-agents/.env.dev)
          VITE_SUPABASE_URL=$(npx @dotenvx/dotenvx get VITE_SUPABASE_URL -f pinai-agents/.env.dev)
          VITE_SUPABASE_PUBLISHABLE_KEY=$(npx @dotenvx/dotenvx get VITE_SUPABASE_PUBLISHABLE_KEY -f pinai-agents/.env.dev)
          echo "VITE_PIN_API_URL=$VITE_PIN_API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}

      - name: Deploy frontend to dev
        working-directory: proactive-ai-frontend
        run: |
          flyctl deploy --config fly.toml --remote-only \
            --build-arg VITE_PIN_API_URL="$VITE_PIN_API_URL" \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
