name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [proactive-ai-v2]
    paths:
      - 'apis/**'
      - 'proactive-ai-frontend/**'
      - 'fly.api-dev.toml'
      - 'package*.json'
      - 'scripts/**'
      - 'ops/litellm/**'
      - 'pinai-openclaw/**'

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apis: ${{ steps.filter.outputs.apis }}
      litellm: ${{ steps.filter.outputs.litellm }}
      openclaw: ${{ steps.filter.outputs.openclaw }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            apis:
              - 'apis/**'
              - 'proactive-ai-frontend/**'
              - 'fly.api-dev.toml'
              - 'package*.json'
              - 'scripts/**'
            litellm:
              - 'ops/litellm/**'
            openclaw:
              - 'pinai-openclaw/**'

  build-openclaw:
    needs: changes
    if: needs.changes.outputs.openclaw == 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy-ref: ${{ steps.commit.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and push OpenClaw image
        run: |
          flyctl deploy . \
            --config fly.openclaw.toml \
            --build-only \
            --push \
            --image-label "openclaw-$(date +%Y%m%d-%H%M%S)" \
            --remote-only \
            --depot=false \
            --yes 2>&1 | tee build-output.txt

          DIGEST=$(grep -Eo "sha256:[0-9a-f]{64}" build-output.txt | tail -1)
          if [ -z "$DIGEST" ]; then
            echo "::error::Failed to extract digest from build output"
            exit 1
          fi
          echo "DIGEST_REF=registry.fly.io/proactive-ai-openclaw@${DIGEST}" >> $GITHUB_ENV
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Update OPENCLAW_IMAGE in dev
        run: |
          npx @dotenvx/dotenvx set OPENCLAW_IMAGE "${{ env.DIGEST_REF }}" -f apis/.env.dev
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}

      - name: Commit updated digest
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apis/.env.dev
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update OPENCLAW_IMAGE digest [skip ci]"
          git push
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## OpenClaw Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Digest: \`${{ env.DIGEST_REF }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-apis:
    needs: [changes, build-openclaw]
    # Run when apis or openclaw changed (or manual trigger), but not if build-openclaw failed
    if: |
      always()
      && needs.changes.result == 'success'
      && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.apis == 'true' || needs.changes.outputs.openclaw == 'true')
      && needs.build-openclaw.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the commit with updated digest if build-openclaw pushed one
          ref: ${{ needs.build-openclaw.outputs.deploy-ref || github.sha }}
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Extract VITE_* build args from encrypted env
        run: |
          VITE_SUPABASE_URL=$(npx @dotenvx/dotenvx get VITE_SUPABASE_URL -f apis/.env.dev)
          VITE_SUPABASE_PUBLISHABLE_KEY=$(npx @dotenvx/dotenvx get VITE_SUPABASE_PUBLISHABLE_KEY -f apis/.env.dev)
          VITE_API_BASE_URL=$(npx @dotenvx/dotenvx get VITE_API_BASE_URL -f apis/.env.dev)
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> "$GITHUB_ENV"
        env:
          DOTENV_PRIVATE_KEY_DEV: ${{ secrets.DOTENV_PRIVATE_KEY_DEV }}

      - name: Deploy APIs to dev
        run: |
          flyctl deploy --config fly.api-dev.toml --remote-only \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-litellm:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.litellm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy LiteLLM to dev
        working-directory: ops/litellm
        run: flyctl deploy --config fly.litellm-dev.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
