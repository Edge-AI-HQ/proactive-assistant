name: Deploy Dev

# Dev env: auto on push to main (path-filtered), also manual
# dispatch. Thin caller — all deploy logic lives in _deploy.yml.
#
# run_filter is on for push (deploy only the components whose source
# changed) and off for workflow_dispatch (deploy everything). The frontend
# component also watches backend/.env.dev because the VITE_* build args
# live there.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ops/litellm/**'
      - 'apps/web/**'
      - 'packages/**'

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    # Private repo only: public-mirror.yml copies this file to the public mirror.
    if: github.repository == 'Edge-AI-HQ/PIN-AI-ASSISTANT'
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      env_file: .env.dev
      dotenv_key_name: DOTENV_PRIVATE_KEY_DEV
      api_app: proactive-ai-api-dev
      engine_app: proactive-ai-engine-dev
      reward_app: proactive-ai-reward-dev
      api_toml: deploy/fly-split/fly.api.dev.toml
      engine_toml: deploy/fly-split/fly.engine.dev.toml
      reward_toml: deploy/fly-split/fly.reward.dev.toml
      litellm_app: proactive-ai-litellm-dev
      litellm_toml: fly.litellm-dev.toml
      web_toml: apps/web/fly.toml
      daytona_version: dev
      run_filter: ${{ github.event_name == 'push' }}
