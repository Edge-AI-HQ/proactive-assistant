name: Payment Period Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: payment-period-cron
  cancel-in-progress: false

jobs:
  apply-period-budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger subscription period budget sync
        env:
          PAYMENT_CRON_URL: ${{ secrets.PAYMENT_CRON_URL }}
          AUTH_TOKEN: ${{ secrets.API_INTERNAL_TOKEN }}
        run: |
          set -euo pipefail
          URL="${PAYMENT_CRON_URL:-https://pinclaw-api-dev.fly.dev/api/payment/internal/apply-subscription-period-budgets}"
          if [ -z "${AUTH_TOKEN}" ]; then
            echo "Missing API_INTERNAL_TOKEN secret" >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -X POST "$URL" \
            -H "Authorization: Bearer ${AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{}'
