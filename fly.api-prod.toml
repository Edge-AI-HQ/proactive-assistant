app = 'proactive-ai-api-prod'
primary_region = 'iad'

[build]
  dockerfile = 'apis/Dockerfile'
  [build.args]
    DEPLOY_ENV = 'production'
    # VITE_* injected via --build-arg (from dotenvx encrypted apis/.env.production)

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  CONTAINER_RUNTIME = 'fly'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 150
    soft_limit = 100

[deploy]
  release_command = 'dotenvx run -f .env.production -- node scripts/run-all-migrations.mjs'
  strategy = 'rolling'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
