<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPA — Proactive AI</title>
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1a2035;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-violet: #a78bfa;
      --accent-gold: #eab308;
      --accent-mint: #34d399;
      --accent-red: #f87171;
      --border: #1e293b;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--accent-cyan);
    }

    .status {
      font-size: 13px;
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-mint);
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 800px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .hero {
      text-align: center;
      margin-top: 40px;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 300;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.6;
    }

    #generate-btn {
      background: linear-gradient(135deg, var(--accent-cyan), #0891b2);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }

    #generate-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(6, 182, 212, 0.3); }
    #generate-btn:active { transform: translateY(0); }
    #generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    #status-line {
      font-size: 13px;
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
      min-height: 20px;
    }

    #cards-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .intent-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: border-color 0.2s;
    }

    .intent-card:hover { border-color: var(--accent-cyan); }

    .card-basket {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
    }

    .basket-work { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); }
    .basket-health { background: rgba(167, 139, 250, 0.15); color: var(--accent-violet); }
    .basket-family { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
    .basket-wealth { background: rgba(234, 179, 8, 0.15); color: var(--accent-gold); }
    .basket-growth { background: rgba(52, 211, 153, 0.15); color: var(--accent-mint); }
    .basket-life { background: rgba(248, 113, 113, 0.15); color: var(--accent-red); }

    .card-title {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-why {
      font-size: 13px;
      color: var(--accent-amber);
      margin-bottom: 12px;
    }

    .card-summary {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-actions button {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all 0.15s;
    }

    .action-primary {
      background: var(--accent-cyan);
      color: white;
      border-color: var(--accent-cyan) !important;
    }

    .action-secondary {
      background: transparent;
      color: var(--text-secondary);
    }

    .action-secondary:hover { background: var(--bg-secondary); }

    .card-meta {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .score-bar {
      display: inline-block;
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      vertical-align: middle;
      margin-left: 4px;
    }

    .score-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--accent-mint);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">SIPA</div>
    <div class="status"><span class="dot"></span>Proactive AI Engine</div>
  </header>

  <main>
    <div class="hero">
      <h1>Intent Card Generator</h1>
      <p>Generate AI-powered recommendations based on your profile, goals, and current context. Each card is a pre-processed decision ready for your approval.</p>
    </div>

    <button id="generate-btn">Generate Intent Cards</button>
    <div id="status-line"></div>
    <div id="cards-container"></div>
  </main>

  <script>
    const btn = document.getElementById('generate-btn');
    const statusLine = document.getElementById('status-line');
    const container = document.getElementById('cards-container');

    btn.addEventListener('click', () => {
      btn.disabled = true;
      container.innerHTML = '';
      statusLine.textContent = 'Starting pipeline...';

      const es = new EventSource('/proactive-ai/api/generate');

      es.onmessage = (e) => {
        const event = JSON.parse(e.data);
        switch (event.type) {
          case 'pipeline:start':
            statusLine.textContent = 'Pipeline started (' + event.data.maxIterations + ' iterations max)';
            break;
          case 'pipeline:iteration':
            statusLine.textContent = 'Iteration ' + event.data.iteration + ': ' + event.data.phase + '...';
            break;
          case 'pipeline:cards':
            statusLine.textContent = 'Iteration ' + event.data.iteration + ': generated ' + event.data.cards.length + ' cards';
            break;
          case 'pipeline:evaluation': {
            const passed = event.data.evaluation.evaluations.filter(ev => ev.pass).length;
            const total = event.data.evaluation.evaluations.length;
            statusLine.textContent = 'Iteration ' + event.data.iteration + ': ' + passed + '/' + total + ' cards passed';
            break;
          }
          case 'pipeline:complete':
            statusLine.textContent = 'Done! ' + event.data.finalCards.length + ' cards generated in ' + event.data.totalIterations + ' iterations';
            renderCards(event.data.finalCards);
            btn.disabled = false;
            es.close();
            break;
          case 'pipeline:error':
            statusLine.textContent = 'Error: ' + event.data.message;
            btn.disabled = false;
            es.close();
            break;
        }
      };

      es.onerror = () => {
        statusLine.textContent = 'Connection lost';
        btn.disabled = false;
        es.close();
      };
    });

    function renderCards(cards) {
      container.innerHTML = '';
      for (const card of cards) {
        const el = document.createElement('div');
        el.className = 'intent-card';
        el.innerHTML =
          '<span class="card-basket basket-' + card.goalBasket + '">' + card.goalBasket + '</span>' +
          '<div class="card-title">' + esc(card.title) + '</div>' +
          '<div class="card-why">' + esc(card.whyNow) + '</div>' +
          '<div class="card-summary">' + esc(card.summary) + '</div>' +
          '<div class="card-actions">' +
            '<button class="action-primary">' + esc(card.primaryAction.label) + '</button>' +
            card.secondaryActions.map(a =>
              '<button class="action-secondary">' + esc(a.label) + '</button>'
            ).join('') +
          '</div>' +
          '<div class="card-meta">' +
            '<span>confidence <span class="score-bar"><span class="score-fill" style="width:' + (card.confidence * 100) + '%"></span></span></span>' +
            '<span>urgency <span class="score-bar"><span class="score-fill" style="width:' + (card.urgency * 100) + '%"></span></span></span>' +
            '<span>importance <span class="score-bar"><span class="score-fill" style="width:' + (card.importance * 100) + '%"></span></span></span>' +
          '</div>';
        container.appendChild(el);
      }
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }
  </script>
</body>
</html>
