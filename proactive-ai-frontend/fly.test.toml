# Test env mirror of fly.toml.
# VITE_PIN_API_URL points at proactive-ai-api-test fly URL (test runs the
# three-app split — there is no single agents-test app).
# VITE_SUPABASE_* point at the dedicated test Supabase project.

app = "proactive-ai-frontend-test"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# Runtime nginx config — envsubst'd into /etc/nginx/conf.d/default.conf
# by nginx:alpine's standard template mechanism. See Dockerfile comment
# above the `templates/default.conf.template` heredoc for the rationale.
[env]
  NGINX_RESOLVER = "[fdaa::3]"
  NGINX_UPSTREAM_URL = "https://proactive-ai-api-test.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
