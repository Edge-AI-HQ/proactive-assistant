# proactive-ai-frontend on Fly.io.
#
# Static SPA served by nginx (see Dockerfile). Build-time VITE_* args are
# wired through `fly deploy --build-arg KEY=VALUE` or, for stable values,
# the [[build.args]] block below.
#
# Two apps will exist (one per env), keyed by the same Dockerfile:
#   * proactive-ai-frontend-dev  — VITE_PIN_API_URL = pinai-agents-dev fly URL
#   * proactive-ai-frontend-prod — VITE_PIN_API_URL = pinai-agents-prod fly URL
#
# Switching between them: `flyctl deploy -a proactive-ai-frontend-dev`.

app = "proactive-ai-frontend-dev"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# Runtime nginx config — envsubst'd into /etc/nginx/conf.d/default.conf
# by nginx:alpine's standard template mechanism. See Dockerfile comment
# above the `templates/default.conf.template` heredoc for the rationale.
[env]
  NGINX_RESOLVER = "[fdaa::3]"
  # dev 切三-app 后,前端 /api/* 反代到 api 进程(trusted edge),不是已停的单 app。
  NGINX_UPSTREAM_URL = "https://proactive-ai-api-dev.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
