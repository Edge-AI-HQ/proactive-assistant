# LiteLLM Fly.io deployment config (prod)
# 与 apis 共用同一 Supabase 数据库,确保 budget 同步生效
app = 'pinclaw-litellm-prod'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 240
    soft_limit = 120

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health/readiness"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
