general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # 与 apis 共用同一库，通过 ?schema=litellm 隔离，表建在 litellm schema 不碰 public
  # LiteLLM 启动时自动跑 Prisma migration 建表/更新表
  database_url: os.environ/DATABASE_URL
  # 健康检查端点不需要认证
  disable_auth_on_health: true

litellm_settings:
  set_verbose: false
  drop_params: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  # 180s upstream timeout — generator 一次输出 8 张卡片 + thinking_budget=8000
  # 实测 60-100s 真实生成时间，原 60s 会在 stream 未读完时切断。
  # 提到 180 留余量，对 chat / evolve 等短调用无影响（只是上限）。
  timeout: 180

model_list:
  # Anthropic Claude on AWS Bedrock (default upstream for sonnet/opus 4.6).
  # Uses US cross-region inference profile (us-east-1 / us-east-2 / us-west-2).
  # Credentials provisioned via dedicated IAM user 'pinai-litellm-bedrock'
  # (policy: PinaiLiteLLMBedrockInvoke — Anthropic Claude models only).
  - model_name: claude-sonnet-4-6
    litellm_params:
      # TEMP (2026-05-24): Bedrock 新账号 RPM 被限到 10（default 10000），提额
      # case 审批中。期间把这个 alias 临时指向 Anthropic 直连避开 Bedrock 429。
      # 配额批下来后：还原下面注释掉的 bedrock 三行、删掉 anthropic 两行即可。
      # 详见 memory project_dev_bedrock_rpm_throttle。
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      # model: bedrock/us.anthropic.claude-sonnet-4-6
      # aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      # aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      # aws_region_name: us-east-1
      cache_control_injection_points:
        # index:0 = tools+system (static prefix), index:-1 = conversation
        # tail. NOT role:system — that marked EVERY system message, so the
        # per-turn <current_datetime> blocks overflowed Anthropic's max of 4
        # ("Found 5" card-chat 400). Two fixed breakpoints, count-bounded.
        - location: message
          index: 0
          # ttl 1h on the head: Anthropic rejects any 1h block that comes
          # after a 5m block (order: tools → system → messages). The generate
          # path pins its own 1h breakpoint mid-conversation (generator
          # _cache_block, cache_ttl="1h" for >5min cadences) — a default-5m
          # head would precede it after the litellm→Anthropic user-message
          # merge and 400 every slow-cadence generate. 1h(head) →
          # 1h|5m(generator) → 5m(tail) is legal in every combination.
          control: { type: ephemeral, ttl: 1h }
        - location: message
          index: -1
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      input_cost_per_token_above_200k_tokens: 0.000003
      output_cost_per_token_above_200k_tokens: 0.000015
      cache_creation_input_token_cost_above_200k_tokens: 0.00000375
      cache_read_input_token_cost_above_200k_tokens: 0.0000003

  - model_name: claude-opus-4-6
    litellm_params:
      # TEMP (2026-05-24): 同 claude-sonnet-4-6，临时切 Anthropic 直连避 Bedrock 429。
      # 配额批下来后还原下面 bedrock 三行、删掉 anthropic 两行。
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      # model: bedrock/us.anthropic.claude-opus-4-6-v1
      # aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      # aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      # aws_region_name: us-east-1
      cache_control_injection_points:
        # index:0 = tools+system (static prefix), index:-1 = conversation
        # tail. NOT role:system — that marked EVERY system message, so the
        # per-turn <current_datetime> blocks overflowed Anthropic's max of 4
        # ("Found 5" card-chat 400). Two fixed breakpoints, count-bounded.
        - location: message
          index: 0
          # ttl 1h on the head: Anthropic rejects any 1h block that comes
          # after a 5m block (order: tools → system → messages). The generate
          # path pins its own 1h breakpoint mid-conversation (generator
          # _cache_block, cache_ttl="1h" for >5min cadences) — a default-5m
          # head would precede it after the litellm→Anthropic user-message
          # merge and 400 every slow-cadence generate. 1h(head) →
          # 1h|5m(generator) → 5m(tail) is legal in every combination.
          control: { type: ephemeral, ttl: 1h }
        - location: message
          index: -1
    model_info:
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      input_cost_per_token_above_200k_tokens: 0.000005
      output_cost_per_token_above_200k_tokens: 0.000025
      cache_creation_input_token_cost_above_200k_tokens: 0.00000625
      cache_read_input_token_cost_above_200k_tokens: 0.0000005

  # Small/fast tier for internal annotations (chat work-group titles via
  # PINAI_GROUP_TITLE_MODEL). Anthropic direct, same posture as above.
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005

  # Anthropic direct (kept as fallback / for capability comparison).
