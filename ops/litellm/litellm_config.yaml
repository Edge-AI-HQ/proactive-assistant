general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # 与 apis 共用同一库，通过 ?schema=litellm 隔离，表建在 litellm schema 不碰 public
  # LiteLLM 启动时自动跑 Prisma migration 建表/更新表
  database_url: os.environ/DATABASE_URL
  # 健康检查端点不需要认证
  disable_auth_on_health: true

litellm_settings:
  set_verbose: false
  drop_params: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  # 180s upstream timeout — generator 一次输出 8 张卡片 + thinking_budget=8000
  # 实测 60-100s 真实生成时间，原 60s 会在 stream 未读完时切断。
  # 提到 180 留余量，对 chat / evolve 等短调用无影响（只是上限）。
  timeout: 180

model_list:
  # Anthropic
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      # Auto-inject cache_control breakpoints so Anthropic reuses stable
      # prompt prefixes across turns (~90% cheaper on cache reads).
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          role: user
          index: -1
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      input_cost_per_token_above_200k_tokens: 0.000003
      output_cost_per_token_above_200k_tokens: 0.000015
      cache_creation_input_token_cost_above_200k_tokens: 0.00000375
      cache_read_input_token_cost_above_200k_tokens: 0.0000003

  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          role: user
          index: -1
    model_info:
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      input_cost_per_token_above_200k_tokens: 0.000005
      output_cost_per_token_above_200k_tokens: 0.000025
      cache_creation_input_token_cost_above_200k_tokens: 0.00000625
      cache_read_input_token_cost_above_200k_tokens: 0.0000005

  # ElevenLabs
  - model_name: elevenlabs-tts
    litellm_params:
      model: elevenlabs/eleven_multilingual_v2
      api_key: os.environ/ELEVENLABS_API_KEY

  # OpenAI
  - model_name: gpt-4o-mini-transcribe
    litellm_params:
      model: gpt-4o-mini-transcribe
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: audio_transcription
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  # gpt-5.5 — used as cross-family evaluator for the generator subagent.
  # Stable alias (no version suffix) so we ride point releases automatically.
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-image-1
    litellm_params:
      model: openai/gpt-image-1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: image_generation

  # Gemini
  # - model_name: "*"
  #   litellm_params:
  #     model: "gemini/*"
  #     api_key: "os.environ/OPENAI_API_KEY"

  # Minimax
  - model_name: minimax-m2.7
    litellm_params:
      model: minimax/MiniMax-M2.7
      api_key: os.environ/MINIMAX_API_KEY

  # - model_name: seed-2-0
  #   litellm_params:
  #     model: volcengine/ep-20260304110144-6zwwz
  #     api_key: os.environ/VOLCENGINE_API_KEY
  
  # Moonshot
  - model_name: kimi-k2.6
    litellm_params:
      model: moonshot/kimi-k2.6
      api_key: os.environ/MOONSHOT_API_KEY

  # Perplexity (search-grounded)
  - model_name: sonar-pro
    litellm_params:
      model: perplexity/sonar-pro
      api_key: os.environ/PERPLEXITYAI_API_KEY

  # Embeddings — drives pgvector semantic memory search.
  # Pinned at 1536 dims to match the vector column declared in
  # pinai-agents/db/migrations/029_pgvector_semantic_memory.sql.
  # Bumping to a different-dim model requires a schema migration
  # (drop + recreate the embedding columns).
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding
      input_cost_per_token: 0.00000002
