general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # 使用 LITELLM_DB_URL 而非 DATABASE_URL，避免 Prisma 自动识别触发迁移检查
  # 与 apis 共用同一库时，须带 ?schema=litellm，表会建在 litellm schema，不碰 public
  database_url: os.environ/LITELLM_DB_URL
  # 健康检查端点不需要认证
  disable_auth_on_health: true
  store_model_in_db: true

litellm_settings:
  set_verbose: false
  drop_params: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 60

model_list:
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  
  - model_name: minimax-m2.5
    litellm_params:
      model: minimax/MiniMax-M2.5
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: seed-2-0
    litellm_params:
      model: volcengine/ep-20260304110144-6zwwz
      api_key: os.environ/VOLCENGINE_API_KEY
  
  - model_name: kimi-k2.5
    litellm_params:
      model: openai/kimi-k2.5
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: https://api.moonshot.ai/v1
