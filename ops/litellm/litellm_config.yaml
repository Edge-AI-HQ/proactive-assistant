general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # 使用 LITELLM_DB_URL 而非 DATABASE_URL，避免 Prisma 自动识别触发迁移检查
  # 与 apis 共用同一库时，须带 ?schema=litellm，表会建在 litellm schema，不碰 public
  database_url: os.environ/LITELLM_DB_URL
  # 健康检查端点不需要认证
  disable_auth_on_health: true

litellm_settings:
  set_verbose: false
  drop_params: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 60

model_list:
  # Anthropic
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # ElevenLabs
  - model_name: elevenlabs-tts
    litellm_params:
      model: elevenlabs/eleven_multilingual_v2
      api_key: os.environ/ELEVENLABS_API_KEY

  # OpenAI
  - model_name: whisper
    litellm_params:
      model: whisper-1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: audio_transcription
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Gemini
  # - model_name: "*"
  #   litellm_params:
  #     model: "gemini/*"
