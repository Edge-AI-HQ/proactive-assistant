app = 'proactive-ai-litellm-test'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    DEPLOY_ENV = 'test'

[env]
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 80
    soft_limit = 40

  [[http_service.checks]]
    # First-time deploy into a fresh `litellm` schema runs all 200+
    # prisma migrations inline before uvicorn opens port 4000.
    # Several migrations hit idempotent-resolve cycles (~1 min each),
    # so first deploy can take 6-8 min. Subsequent deploys are quick
    # — keep the long grace_period anyway (it costs nothing on warm
    # boot, only matters on cold starts). default fly grace was 60s
    # which caused `flyctl deploy` to time out before migration
    # finished even though the machine self-recovered.
    grace_period = "10m"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health/readiness"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
