app = 'proactive-ai-litellm-prod'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    DEPLOY_ENV = 'production'

[env]
  PORT = '4000'
  DISABLE_SCHEMA_UPDATE = 'true'

[deploy]
  release_command = "--config /app/config.yaml --skip_server_startup"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 80
    soft_limit = 40

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health/readiness"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
