app = 'proactive-ai-litellm-prod'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  [build.args]
    DEPLOY_ENV = 'production'

[env]
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 80
    soft_limit = 40

  [[http_service.checks]]
    # First-time deploy into a fresh `litellm` schema runs all 200+ prisma
    # migrations inline before uvicorn opens port 4000 — can take 6-8 min.
    # The default 60s grace made `flyctl deploy` time out before migrations
    # finished (machine self-recovered, but deploy reported failure).
    # Matches fly.litellm-test.toml.
    grace_period = "10m"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health/readiness"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
